<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6a3e">
<title>竹つなぎ</title>
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+1p:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: phone-width app column — sticky top bar / page content / sticky action bar + tab nav */
:root{
  --outer:#dfe8d8; --bg:#f3f7ef; --surface:#ffffff; --ink:#1d2b20; --muted:#5b6b5e; --line:#dae4d3;
  --bamboo:#2d6a3e; --bamboo-soft:#e0eed9; --on-bamboo:#ffffff; --leaf:#7fae2e; --leaf-soft:#eef6dc;
  --sun:#c27c0e; --sun-soft:#fcefd4; --sky:#2b74c2; --sky-soft:#e2edf9; --danger:#b3412f; --danger-soft:#f8e3df;
  --gray:#7b867d; --gray-soft:#eceeea;
  --shadow:0 1px 2px rgba(29,43,32,.06),0 4px 14px rgba(29,43,32,.07);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"M PLUS 1p","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --outer:#0c110d;--bg:#121914;--surface:#1a241d;--ink:#e4ede2;--muted:#9baa9d;--line:#2a392e;
  --bamboo:#72c488;--bamboo-soft:#20362a;--on-bamboo:#0d1a11;--leaf:#a5d45a;--leaf-soft:#25331b;
  --sun:#f0b650;--sun-soft:#3a2f18;--sky:#7db4ee;--sky-soft:#1c2c3d;--danger:#f08a78;--danger-soft:#3b2220;
  --gray:#9aa59c;--gray-soft:#262e28;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;display:flex;justify-content:center}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone は16px未満の入力欄をタップすると画面を拡大してしまうので16pxにそろえる */
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}

.app{position:relative;width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow-x:clip}
@media (max-width:479px){body{background:var(--bg)}}
@media (min-width:480px){.app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12)}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;color:var(--bamboo);flex:1;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;display:block}
.brand span{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.04em}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;margin-left:-8px;flex:none}
.icon-btn:hover{background:var(--bamboo-soft)}
.chip-top{flex:none;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--sun-soft);color:var(--sun);font-weight:700;font-size:12.5px;border:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-top.owner{background:var(--bamboo-soft);color:var(--bamboo)}

#view{flex:1;min-width:0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:20px}
#view>*{min-width:0}
.dock{position:sticky;bottom:0;z-index:1000;width:100%;min-width:0}
#action{min-width:0;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.tabnav{display:grid;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 9px;font-size:10.5px;color:var(--muted);position:relative;min-width:0}
.tabnav button[aria-current="page"]{color:var(--bamboo);font-weight:700}
.tabnav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 18px;border-radius:12px;border:0;font-weight:700;font-size:16px;background:var(--bamboo);color:var(--on-bamboo);text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--bamboo);box-shadow:inset 0 0 0 1.5px var(--bamboo)}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sun{background:var(--sun);color:var(--on-bamboo)}
.btn.small{min-height:38px;font-size:14px;padding:6px 14px;width:auto;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.link{font-size:13px;color:var(--bamboo);font-weight:700;background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:4px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:16px;font-weight:700;margin-bottom:10px}
.note{font-size:12px;color:var(--muted);text-align:center}
.hint{font-size:12.5px;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);border:1px dashed var(--line);font-size:14px}
.stack{display:grid;gap:10px}
.stack>*{min-width:0}

/* concept banner */
.concept{position:relative;border-radius:20px;overflow:hidden;background:var(--bamboo);color:var(--on-bamboo);padding:20px 18px 18px;display:flex;flex-direction:column;gap:6px}
.concept svg.art{position:absolute;inset:0;width:100%;height:100%}
.concept>*:not(svg){position:relative}
/* 実際の竹林の写真。文字が読めるよう下に向かって濃くなる緑のかげをのせる（明暗どちらのテーマでも白文字） */
.concept.photo{min-height:230px;justify-content:flex-end;color:#fff;background:linear-gradient(180deg,rgba(18,42,26,.25) 0%,rgba(18,42,26,.55) 45%,rgba(18,42,26,.88) 100%),url(img/hero.jpg) center 45%/cover #2d6a3e}
.concept.photo h2,.concept.photo p{text-shadow:0 1px 3px rgba(0,0,0,.45)}
.concept .hello{font-size:13px;font-weight:700;opacity:.9}
.concept h2{font-size:21px;font-weight:900;line-height:1.45}
.concept p{font-size:13px;opacity:.92}
.purpose-pick{display:flex;flex-wrap:wrap;gap:8px}
.purpose-pick button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:0;background:var(--sun-soft);color:var(--sun);font-weight:700;font-size:14px}
.purpose-pick button:hover{filter:brightness(.97)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;border:0;background:var(--surface);box-shadow:var(--shadow);text-align:left;min-width:0}
.quick button .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.quick button.primary{background:var(--bamboo);color:var(--on-bamboo)}
.quick button.primary .ic{background:rgba(255,255,255,.18);color:var(--on-bamboo)}
.quick b{font-size:15px;line-height:1.35}
.quick small{font-size:12px;opacity:.8;line-height:1.4}
.quick .badge{margin-left:auto;align-self:flex-start}

/* tags & chips */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--bamboo-soft);color:var(--bamboo);white-space:nowrap}
.tag.sun{background:var(--sun-soft);color:var(--sun)}
.tag.sky{background:var(--sky-soft);color:var(--sky)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.gray{background:var(--gray-soft);color:var(--gray)}
.tag.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.tag.wrap{white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--bamboo);border-color:var(--bamboo);color:var(--on-bamboo)}
.chip.purpose[aria-pressed="true"]{background:var(--sun);border-color:var(--sun)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-open{background:var(--bamboo-soft);color:var(--bamboo)}
.st-work{background:var(--sun-soft);color:var(--sun)}
.st-keep{background:var(--sky-soft);color:var(--sky)}
.st-end{background:var(--gray-soft);color:var(--gray)}
.burden{display:inline-flex;gap:2px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.burden i{width:7px;height:12px;border-radius:2px;background:var(--line);display:inline-block}
.burden i.on{background:var(--sun)}
.risk0{color:var(--bamboo)} .risk1{color:var(--sun)} .risk2{color:var(--danger)}

/* map */
.lmap{height:320px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--bamboo-soft);z-index:0}
.lmap.small{height:200px}
.map-fallback{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.mk{background:none;border:0}
.mk .lb{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;padding:1px 7px 1px 5px;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap;font-family:var(--f-body);border:2px solid var(--c)}
.mk .lb i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mk .dt{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.sel .lb{background:var(--c);color:#fff}
.lme{width:18px;height:18px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,116,194,.25)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.legend button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend button[aria-pressed="true"]{border-color:var(--c);color:var(--ink)}
.legend button[aria-pressed="false"] i{opacity:.35}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;margin:12px 14px;min-width:200px}
.pop-img{aspect-ratio:16/9;border-radius:8px;overflow:hidden;margin-bottom:6px}
.pop-img img{width:100%;height:100%;object-fit:cover;display:block}
.pop h4{margin:0 0 4px;font-family:var(--f-display);font-size:15px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:6px 0}
.pop dt{color:var(--muted)} .pop dd{margin:0;font-weight:700}
.pop .btn{margin-top:6px;min-height:36px;font-size:13px}
.map-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}

/* panels & filters */
.panel{background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:14px;color:var(--muted);font-family:var(--f-body)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);font-weight:700;min-width:0}
.sel{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:42px;width:100%}
.toolbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.count{font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--bamboo);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:12px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--bamboo)}

/* cards */
.cards{display:grid;gap:12px}
.cards>*{min-width:0}
.card{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid transparent;text-align:left;width:100%;min-width:0}
.card.sel{border-color:var(--bamboo)}
.card-top{display:flex;gap:12px;min-width:0}
.thumb{flex:none;width:80px;height:80px;border-radius:10px;overflow:hidden}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.match{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--sun-soft);font-size:12.5px;min-width:0}
.match b{font-family:var(--f-display);font-size:17px;color:var(--sun);font-variant-numeric:tabular-nums;flex:none}
.match span{min-width:0}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.prog .bar{flex:1;margin:0}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.next-line{font-size:12.5px;color:var(--muted)}
.next-line b{color:var(--ink)}

/* detail */
.banner{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.banner svg,.banner img{width:100%;height:100%;display:block;object-fit:cover}
.banner .st{position:absolute;left:12px;top:12px;box-shadow:var(--shadow)}
.d-head{display:flex;flex-direction:column;gap:6px}
.d-head h2{font-size:23px}
.loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:700}
.fact .v{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.fact.wide{grid-column:span 3}
.fact.span2{grid-column:span 2}
.bar{height:8px;border-radius:99px;background:var(--bamboo-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--bamboo);border-radius:99px}
.bar.sun{background:var(--sun-soft)} .bar.sun i{background:var(--sun)}
.box{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box.sun{background:var(--sun-soft);border-color:transparent}
.box.warn{background:var(--danger-soft);border-color:transparent}
.box.sky{background:var(--sky-soft);border-color:transparent}
.box h3{font-size:15.5px}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plain li{display:flex;gap:8px;align-items:flex-start;min-width:0}
.plain li>span{min-width:0}
.ok-mark{flex:none;width:20px;height:20px;border-radius:50%;background:var(--bamboo);color:var(--on-bamboo);display:grid;place-items:center;font-size:12px;font-weight:900;margin-top:2px}
.next-mark{flex:none;width:20px;height:20px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font-weight:900;margin-top:2px}
.task-list{display:grid;gap:8px}
.task-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface);border-radius:12px;border:1px solid var(--line);min-width:0}
.task-row .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.task-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.task-row b{display:block}
.task-row .sub{font-size:12.5px;color:var(--muted)}
.task-row.ng{opacity:.75}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--bamboo-soft);color:var(--bamboo);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.who{display:flex;align-items:center;gap:8px;font-weight:700}

/* stage timeline */
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;position:relative}
.stages::before{content:"";position:absolute;left:8%;right:8%;top:11px;height:3px;background:var(--line)}
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;text-align:center}
.stage i{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:var(--on-bamboo)}
.stage span{font-size:10.5px;line-height:1.3;color:var(--muted);font-weight:700}
.stage.done i{background:var(--bamboo);border-color:var(--bamboo)}
.stage.now i{background:var(--sun);border-color:var(--sun)}
.stage.now span{color:var(--ink)}
.progress-big{display:flex;align-items:baseline;gap:6px}
.progress-big b{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--bamboo);font-variant-numeric:tabular-nums}

/* forms */
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--bamboo);padding:0;margin-bottom:12px}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.req{font-size:11px;color:#fff;background:var(--danger);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:700}
.opt{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:700}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],select.input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);min-height:46px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--bamboo);outline:none}
textarea{min-height:76px;resize:vertical}
.pair{display:flex;gap:8px;min-width:0}
.pair>*{min-width:0;flex:1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.checks.three{grid-template-columns:repeat(3,1fr)}
.checks.seven{grid-template-columns:repeat(7,1fr);gap:4px}
.check{position:relative;min-width:0}
.check input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.check>span{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;height:100%;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--muted);line-height:1.35}

<script>
/* =========================================================
   竹つなぎ v4
   竹林所有者の「してほしい」と、参加者の「やりたい」をつなぎ、
   竹林ごとの整備状況を引き継いで継続的に管理するプロトタイプ。

/* ---------- 日付 ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const nextDow = (dow, k = 0) => { const d = new Date(); const diff = (dow - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + diff + 7 * k); return ymd(d); };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dowOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const fmtDate = (s, t) => { const [, m, d] = s.split('-').map(Number); return `${m}月${d}日(${WD[dowOf(s)]})` + (t ? ` ${t}` : ''); };
const shortDate = s => { const [, m, d] = s.split('-').map(Number); return `${m}/${d}`; };
const nowTs = () => { const d = new Date(); return `${TODAY} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const DEFAULT_HERE = { lat: 33.9168, lng: 134.6597, label: '阿南駅付近（仮の現在地）' };
const TAN = 991.7;

/* ---------- マスタ ---------- */
// risk: 0=初心者OK 1=注意が必要 2=危険（参加条件が必須）
const TASKS = {
  survey: { label: '竹林の状態調査', sub: '竹の本数・混み具合・倒れた竹を見て回る', risk: 0, base: 30 },

  event:  { label: 'イベント運営', sub: '受付・案内・炊き出しの手伝い', risk: 0, base: 30 },
  pro:    { label: '専門的な整備（伐採など）', sub: 'のこぎり・チェーンソーでの伐採', risk: 2, base: 40 },
  other:  { label: 'その他', sub: '所有者と相談して決める作業', risk: 0, base: 25 },
};
const RISK = { 0: ['初心者OK', 'risk0'], 1: ['注意が必要', 'risk1'], 2: ['危険作業・条件あり', 'risk2'] };
const CONDS = {
  exp: { label: '経験者限定', short: '経験者のみ' },
  supervisor: { label: '専門家・管理者の立ち会いあり', short: '立ち会いあり' },
  course: { label: '安全講習の受講が必要', short: '安全講習が必要' },
  license: { label: '必要な資格・条件を満たした人のみ', short: '資格が必要' },
};
const PURPOSES = [
  { id: 'contrib', label: '社会貢献したい', btn: '社会貢献', why: '地域貢献になる活動' },
  { id: 'earn', label: 'お金を稼ぎたい', btn: 'お金を稼ぐ', why: 'お金の報酬がある' },
  { id: 'career', label: '経験・実績を作りたい', btn: '経験を積む', why: '初心者歓迎・実績になる' },
  { id: 'local', label: '地域と関わりたい', btn: '地域と関わる', why: '地域の人と一緒に活動できる' },
  { id: 'learn', label: '竹について学びたい', btn: '竹を学ぶ', why: '竹について学べる' },
  { id: 'biz', label: '竹を自分のビジネス・制作活動に使いたい', btn: '竹を活用する', why: '竹の提供がある' },
  { id: 'social', label: '人と交流したい', btn: '人と交流', why: '大人数でにぎやかに活動' },
  { id: 'other', label: 'その他', btn: 'その他', why: '' },
];
const PURPOSE = Object.fromEntries(PURPOSES.map(p => [p.id, p]));
const HOME_PURPOSES = ['contrib', 'earn', 'career', 'biz', 'local'];
const MERITS = ['地域貢献になる', '経験・実績になる', '初心者歓迎', '竹について学べる', '地域の人と交流できる', '技術が身につく'];
const REWARD_TYPES = { money: 'お金', shoot: 'たけのこ', bamboo: '竹の提供', cert: '実績の認定', food: '食事・おやつ', other: 'その他' };
const BURDEN = { 1: ['軽め', '歩く・記録するなど体への負担が少ない'], 2: ['ふつう', '竹を集める・運ぶなど少し体を使う'], 3: ['きつめ', '斜面での作業や重い竹を扱う'] };

const EXP = { none: 'はじめて', some: '少しある', lots: '経験豊富' };

const USES = ['メンマ（食品）', '竹炭', '竹チップ', '工芸品', '建材', 'バイオマス'];

const LOT = {

  diam: { thin: '5cm未満', mid: '5〜8cm', thick: '8cm以上' },

};

}

function eligible(task, u = me()) {

/* ---------- マッチング：やりたい × してほしい ---------- */
function purposeHit(p, r, g) {
  const has = m => r.merits.includes(m);
  switch (p) {
    case 'contrib': return has('地域貢献になる') || g.cond.level === 0;
    case 'earn': return r.rewards.some(x => x.type === 'money');
    case 'career': return has('経験・実績になる') || has('初心者歓迎') || r.rewards.some(x => x.type === 'cert');
    case 'local': return has('地域の人と交流できる') || has('地域貢献になる');
    case 'learn': return has('竹について学べる') || r.tasks.some(t => t.id === 'survey' || t.id === 'craft');
    case 'biz': return r.rewards.some(x => x.type === 'bamboo') || /商用/.test(g.useNote);
    case 'social': return r.people >= 8 || has('地域の人と交流できる');
    default: return false;
  }
}
function matchInfo(g, u = me()) {
  const r = openReq(g);
  if (!r || !u || u.role !== 'worker') return { score: 0, hits: [], can: [], fit: [] };
  const ps = (u.purposes || []).filter(p => p !== 'other');
  const hits = ps.filter(p => purposeHit(p, r, g));
  const can = r.tasks.filter(t => eligible(t, u).ok);
  const fit = can.filter(t => (u.tasks || []).includes(t.id));
  const dayOk = r.dates.some(d => (u.days || []).includes(dowOf(d)));
  const d = km(state.here, approx(g));
  let s = 10 + (ps.length ? hits.length / ps.length * 45 : 20) + (fit.length ? 15 : 0) + (r.burden <= (u.burden || 3) ? 10 : 0) + (dayOk ? 10 : 0) + (d < 5 ? 10 : d < 10 ? 5 : 0);
  if (!can.length) s = Math.min(s, 20);
  return { score: Math.min(99, Math.round(s)), hits, can, fit, dayOk };
}

  const past = actsOf(uid), tried = new Set(past.flatMap(a => a.tasks)), lines = [];
  tasks.forEach(t => { lines.push([TASKS[t].label, TASKS[t].base]); if (!tried.has(t)) lines.push([`初挑戦ボーナス（${TASKS[t].label}）`, 20]); });

}

    if (role === 'owner') return `
      <div class="role-head"><span class="em">🌳</span><div><b>竹林所有者・農家の登録</b><button class="link" data-act="unpick">えらび直す</button></div></div>
      <form id="signupForm" novalidate>
        <fieldset class="fs"><legend>アカウント</legend>${common}</fieldset>
        <fieldset class="fs"><legend>竹林について</legend>
          <div class="field"><label for="s-area">所在地</label><input type="text" id="s-area" placeholder="例：阿南市宝田町"></div>
          <div class="field"><span class="lbl">所有・管理している竹林</span>
            <div class="checks three">${[['yes', 'ある'], ['manage', '管理を任されている'], ['no', 'これから']].map(([v, l], i) => `<label class="check"><input type="radio" name="hasGrove" value="${v}" ${i === 0 ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
          <div class="field"><label for="s-count">竹林の数</label><div class="stepper"><button type="button" data-act="step" data-t="s-count" data-d="-1" aria-label="減らす">−</button><input type="number" id="s-count" value="1" min="0" max="20"><button type="button" data-act="step" data-t="s-count" data-d="1" aria-label="増やす">＋</button></div></div>
          <div class="field"><span class="lbl">竹林整備で困っていること</span>
            <div class="checks">${TROUBLES.map(x => `<label class="check inline"><input type="checkbox" name="troubles" value="${x}"><span>${x}</span></label>`).join('')}</div>
            <input type="text" id="s-trouble2" placeholder="そのほか困っていること（任意）"></div>
        </fieldset>
        <div class="err" id="authErr" hidden></div>
        <button class="btn" type="submit">竹林所有者・農家として登録する</button>
        <p class="note">プロトタイプのため、パスワードは保存されません。登録内容はこの端末のブラウザの中だけに保存されます。</p>
      </form>`;
    return `
      <div class="role-head" style="background:var(--leaf-soft)"><span class="em">🌱</span><div><b>参加者の登録</b><button class="link" data-act="unpick">えらび直す</button></div></div>
      <form id="signupForm" novalidate>
        <fieldset class="fs"><legend>アカウント</legend>${common}</fieldset>
        ${workerFields({})}
        <div class="err" id="authErr" hidden></div>
        <button class="btn" type="submit">参加者として登録する</button>
        <p class="note">プロトタイプのため、パスワードは保存されません。登録内容はこの端末のブラウザの中だけに保存されます。</p>
      </form>`;
  },

  /* ---------- ホーム ---------- */
  home() {
    const u = me();
    const concept = `<section class="concept photo"><p class="hello">こんにちは、${esc(u.name)}さん</p><h2>竹林の“してほしい”と、<br>あなたの“やりたい”をつなぐ。</h2>
      <p>${isOwner() ? '自分では整備できない竹林も、必要な作業を登録すれば担い手が見つかります。' : '自分の目的に合った竹林の活動を見つけよう。'}</p></section>`;
    const purposeBtns = `<section><div class="section-title">何がしたいですか？</div><div class="purpose-pick">${HOME_PURPOSES.map(p => `<button data-act="purposego" data-p="${p}">${PURPOSE[p].btn}</button>`).join('')}</div></section>`;
    if (isOwner()) {
      const mine = db.groves.filter(isMine), pend = ownerPending();
      const matched = db.apps.filter(a => a.status === 'matched' && isMine(groveOfApp(a)));
      const hist = mine.flatMap(g => g.log.map(l => ({ ...l, g }))).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
      return `${concept}
      <div class="quick">
        <button class="primary" data-act="go" data-to="regGrove"><span class="ic">${I.plus(22)}</span><b>竹林を登録する</b><small>場所・規模・状態</small></button>
        <button data-act="go" data-to="regReq"><span class="ic">${I.list(22)}</span><b>整備依頼を登録する</b><small>してほしい作業・報酬</small></button>
        <button data-act="tab" data-to="matches" data-tab="pending"><span class="ic">${I.users(22)}</span><b>応募者を確認する${pend.length ? ` <span class="tag danger">${pend.length}件</span>` : ''}</b><small>承認するとマッチング</small></button>
        <button data-act="tab" data-to="matches" data-tab="matched"><span class="ic">${I.chat(22)}</span><b>チャット</b><small>日時・集合場所の相談</small></button>
      </div>
      <section><div class="section-title">応募者${pend.length ? `（${pend.length}件）` : ''}</div>
        ${pend.length ? `<div class="list">${pend.map(a => personRow(a, true)).join('')}</div>` : '<div class="empty">いま承認待ちの応募はありません。</div>'}</section>
      <section><div class="section-title">マッチング中の参加者</div>
        ${matched.length ? `<div class="list">${matched.map(a => personRow(a, true)).join('')}</div>` : '<div class="empty">マッチング中の参加者はいません。</div>'}</section>
      <section><div class="section-title">竹林の整備状況<button class="link" data-act="tab" data-to="groves">すべて見る</button></div>
        <div class="cards">${mine.map(g => groveCard(g)).join('') || '<div class="empty">まだ竹林を登録していません。</div>'}</div></section>
      <section><div class="section-title">過去の活動履歴</div>
        ${hist.length ? `<ul class="timeline">${hist.map(h => `<li><time>${shortDate(h.date)}</time><span>${esc(h.text)}<br><span class="hint">${esc(h.g.name)}・${esc(h.by)}</span></span><span></span></li>`).join('')}</ul>` : '<div class="empty">まだ活動の記録はありません。</div>'}</section>`;
    }
    const pt = pointsOf(u.id), rk = rankOf(pt);
    const mine = db.apps.filter(a => a.workerId === u.id);
    const pending = mine.filter(a => a.status === 'pending'), matched = mine.filter(a => a.status === 'matched');
    const contGroves = [...new Set(actsOf(u.id).map(a => a.groveId))].map(grove).filter(Boolean);
    const recs = db.groves.filter(g => openReq(g) && groveStatus(g) === 'open' && !db.apps.some(a => a.workerId === u.id && req(a.reqId).groveId === g.id))
      .map(g => ({ g, m: matchInfo(g) })).filter(x => x.m.can.length).sort((a, b) => b.m.score - a.m.score);
    return `${concept}${purposeBtns}
    <div class="quick">
      <button class="primary" data-act="searchgo" data-mode="all"><span class="ic">${I.map(22)}</span><b>竹林を探す</b><small>地図と一覧から</small></button>
      <button data-act="searchgo" data-mode="match"><span class="ic">${I.sparkle(22)}</span><b>自分に合った仕事を探す</b><small>目的・予定・できる作業から</small></button>
      <button data-act="tab" data-to="achieve"><span class="ic">${I.medal(22)}</span><b>自分の活動実績</b><small>${num(pt)}pt・${rk.cur.name}</small></button>
      <button data-act="tab" data-to="profile"><span class="ic">${I.user(22)}</span><b>やりたいことを登録</b><small>目的・できる作業</small></button>
    </div>
    <button class="rank-card" data-act="tab" data-to="achieve">
      <svg class="deco" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><path d="M11 3v26M21 3v26M8 10h6M8 19h6M18 7h6M18 16h6M18 25h6"/></svg>
      <span class="lab">竹林活動実績</span><span class="val">${num(pt)}<small>pt</small></span><span class="rank">ランク：${rk.cur.name}</span>
      ${rk.next ? `<span class="bar"><i style="width:${((pt - rk.cur.min) / (rk.next.min - rk.cur.min) * 100).toFixed(0)}%"></i></span><span class="next">あと${rk.next.min - pt}ptで「${rk.next.name}」・今月${monthCount(u.id)}回活動</span>` : ''}
    </button>
    <section><div class="section-title">マッチング中の竹林</div>
      ${matched.length ? `<div class="list">${matched.map(a => appItem(a)).join('')}</div>` : '<div class="empty">マッチング中の竹林はありません。</div>'}
      ${pending.length ? `<p class="hint" style="margin-top:8px">ほかに応募中（承認待ち）が ${pending.length}件 あります。<button class="link" data-act="tab" data-to="matches" data-tab="pending">見る</button></p>` : ''}</section>
    <section><div class="section-title">継続して整備している竹林</div>
      ${contGroves.length ? `<div class="list">${contGroves.map(g => contItem(g)).join('')}</div>` : '<div class="empty">活動に参加すると、その竹林のその後をここで追いかけられます。</div>'}</section>
    <section><div class="section-title">おすすめの活動<button class="link" data-act="searchgo" data-mode="match">もっと見る</button></div>
      <div class="cards">${recs.slice(0, 3).map(({ g }) => groveCard(g)).join('') || '<div class="empty">おすすめの活動はまだありません。</div>'}</div></section>`;
  },

  /* ---------- 竹林検索・地図 ---------- */
  search() {
    const f = state.f, u = me(), owner = isOwner();
    if (!f.purposes) f.purposes = new Set(owner ? [] : (u.purposes || []).filter(p => p !== 'other'));
    const list = filteredGroves();
    return `
    ${owner ? '' : `<section class="panel">
      <h3>やりたいことから探す</h3>
      <div class="chips">${PURPOSES.filter(p => p.id !== 'other').map(p => `<button class="chip purpose" data-act="fpurpose" data-p="${p.id}" aria-pressed="${f.purposes.has(p.id)}">${p.btn}</button>`).join('')}</div>
      <label class="switch"><input type="checkbox" id="f-beginner" ${f.beginner ? 'checked' : ''}>初心者でも安全に参加できる活動だけ</label>
      <details class="more" ${f.tasks.size || f.burden || f.reward || f.day || f.dist ? 'open' : ''}>
        <summary>${I.filter(16)}作業内容・負担度・報酬・日時・場所でしぼる</summary>
        <div class="chips" style="margin-bottom:10px">${Object.entries(TASKS).filter(([k]) => k !== 'other').map(([k, t]) => `<button class="chip" data-act="ftask" data-t="${k}" aria-pressed="${f.tasks.has(k)}">${TASK_ICON[k](14)}${t.label}</button>`).join('')}</div>
        <div class="filters">
          <label>負担度<select class="sel" id="f-burden"><option value="0">こだわらない</option><option value="1" ${f.burden == 1 ? 'selected' : ''}>軽めだけ</option><option value="2" ${f.burden == 2 ? 'selected' : ''}>ふつうまで</option></select></label>
          <label>報酬・特典<select class="sel" id="f-reward"><option value="">こだわらない</option>${Object.entries(REWARD_TYPES).map(([k, v]) => `<option value="${k}" ${f.reward === k ? 'selected' : ''}>${v}あり</option>`).join('')}</select></label>
          <label>日時<select class="sel" id="f-day"><option value="">いつでも</option><option value="mine" ${f.day === 'mine' ? 'selected' : ''}>自分の参加できる曜日</option><option value="weekend" ${f.day === 'weekend' ? 'selected' : ''}>土日</option><option value="month" ${f.day === 'month' ? 'selected' : ''}>今月</option></select></label>
          <label>場所<select class="sel" id="f-dist"><option value="0">どこでも</option><option value="5" ${f.dist == 5 ? 'selected' : ''}>5km以内</option><option value="10" ${f.dist == 10 ? 'selected' : ''}>10km以内</option></select></label>
        </div>
      </details>
    </section>`}
    <section>
      <div class="legend" role="group" aria-label="地図に表示する竹林の状態">${Object.entries(STATUS).map(([k, s]) => `<button data-act="fstatus" data-s="${k}" aria-pressed="${f.status.has(k)}" style="--c:${s[2]}"><i></i>${s[0]}</button>`).join('')}</div>
      <div class="lmap" id="searchMap" style="margin-top:8px"></div>
      <div class="map-tools"><span>${I.loc(14)} ${esc(state.here.label)}・色は募集状況、円は竹林のおおよその範囲です</span><button class="link" data-act="gps">${I.gps(14)} 現在地を使う</button></div>
    </section>
    <div class="toolbar"><span class="count">${list.length}か所の竹林</span>
      <select class="sel" id="f-sort" style="width:auto" aria-label="並び替え">
        ${owner ? '' : `<option value="match" ${f.sort === 'match' ? 'selected' : ''}>あなたに合う順</option>`}
        <option value="near" ${f.sort === 'near' ? 'selected' : ''}>近い順</option><option value="date" ${f.sort === 'date' ? 'selected' : ''}>日付が早い順</option></select></div>
    <div class="cards">${list.map(g => groveCard(g, true)).join('') || '<div class="empty">条件に合う竹林がありません。条件を少しゆるめてみてください。</div>'}</div>`;
  },

  /* ---------- 竹林詳細 ---------- */
  detail() {
    const g = grove(state.params.id), o = acc(g.ownerId), r = openReq(g), m = matchInfo(g), exact = canSeeExact(g), st = groveStatus(g);
    return `
    <div class="banner">${groveImg(g)}${stBadge(g)}</div>
    <div class="d-head"><h2>${esc(g.name)}</h2>
      <div class="loc">${I.loc(16)}${esc(g.district)}${!isOwner() ? `・${distLabel(g)}` : ''}</div></div>
    <div class="facts">
      <div class="fact"><span class="k">${I.size(14)}規模</span><span class="v">${num(g.size)}㎡</span></div>
      <div class="fact"><span class="k">${I.users(14)}必要人数</span><span class="v">${r ? `${r.people}人<span class="hint">（決定${joined(r)}人）</span>` : '—'}</span></div>
      <div class="fact"><span class="k">${I.chart(14)}整備状況</span><span class="v">${progress(g)}%</span></div>
      <div class="fact"><span class="k">${I.muscle(14)}負担度</span><span class="v">${r ? BURDEN[r.burden][0] : '—'}</span></div>
      <div class="fact span2"><span class="k">${I.yen(14)}報酬</span><span class="v">${r ? esc(moneyText(r)) : '—'}</span></div>
      <div class="fact wide"><span class="k">${I.gift(14)}特典</span><span class="v">${r ? esc(perkText(r)) : '—'}</span></div>
    </div>
    ${r && !isOwner() ? `<section class="box sun">
      <div class="match" style="padding:0;background:none"><b>相性 ${m.score}%</b><span>あなたの「やりたい」と、この竹林の「してほしい」</span></div>
      ${m.hits.length ? `<ul class="plain">${m.hits.map(p => `<li><span class="ok-mark">✓</span><span><b>${PURPOSE[p].label}</b>：${PURPOSE[p].why}</span></li>`).join('')}</ul>` : '<p class="hint">あなたの目的とは直接合いませんが、新しい経験になるかもしれません。</p>'}
      ${m.dayOk ? '<p class="hint">あなたの参加できる曜日に活動があります。</p>' : ''}
    </section>` : ''}
    ${r ? `<section>
      <div class="section-title">現在必要なこと</div>
      <p class="hint" style="margin:-4px 0 8px">活動日：${datesText(r)}・${esc(r.time)}</p>
      <div class="task-list">${r.tasks.map(t => { const T = TASKS[t.id], e = eligible(t); return `<div class="task-row ${!isOwner() && !e.ok ? 'ng' : ''}"><span class="ic">${TASK_ICON[t.id](22)}</span><span class="t"><b>${T.label}</b><span class="sub">${T.sub}</span>
        <span class="tags"><span class="tag ${T.risk === 2 ? 'danger' : T.risk === 1 ? 'sun' : ''}">${RISK[T.risk][0]}</span>${condTags(t)}</span>
        ${!isOwner() ? (e.ok ? '<span class="hint risk0">あなたは参加できます</span>' : `<span class="hint risk2">参加できません：${e.why.join('・')}</span>`) : ''}</span></div>`; }).join('')}</div>
    </section>
    <section class="box warn"><h3>${I.shield(18)} 注意事項・参加条件</h3>
      <ul class="plain">${r.tasks.filter(t => t.conds.length).map(t => `<li><span>・<b>${TASKS[t.id].label}</b>は${t.conds.map(c => CONDS[c].label).join('・')}</span></li>`).join('')}
        ${r.safety ? `<li><span>・${esc(r.safety)}</span></li>` : ''}<li><span>・参加条件：${esc(r.terms || 'とくになし')}</span></li><li><span>・安全管理者・所有者の指示に従ってください</span></li></ul>
    </section>` : `<section class="box sky"><h3>現在、募集している作業はありません</h3><p>${st === 'end' ? esc(g.issues || '今回の募集は終了しました。') : 'この竹林は継続管理中です。次の整備依頼が登録されると、ここに表示されます。'}</p></section>`}
    <section class="box">
      <div class="item-top"><h3>整備の進み具合</h3><span class="progress-big"><b>${progress(g)}</b>%</span></div>
      ${stagesHTML(g)}
      <h3 style="margin-top:6px">これまでの整備</h3>
      ${g.log.length ? `<ul class="plain">${g.log.map(l => `<li><span class="ok-mark">✓</span><span>${esc(l.text)} <span class="hint">${shortDate(l.date)}・${esc(l.by)}</span></span></li>`).join('')}</ul>` : '<p class="hint">まだ整備の記録はありません。最初の一歩を手伝ってください。</p>'}
      <h3 style="margin-top:6px">次に必要な整備</h3>
      <ul class="plain">${g.next.map(t => `<li><span class="next-mark">→</span><span>${TASKS[t].label}</span></li>`).join('') || '<li><span class="hint">未定</span></li>'}</ul>
      ${g.issues ? `<p class="hint">残っている課題：${esc(g.issues)}</p>` : ''}
      <button class="link" data-act="grovepage" data-id="${g.id}">整備状況・活動履歴をくわしく見る ${I.arrow(14)}</button>
    </section>
    <section class="box"><h3>竹林の状態</h3>
      <p>${COND_LEVEL[g.cond.level]}・竹が${DENSITY[g.cond.density]}${g.cond.fallen ? '・倒れた竹あり' : ''}</p>
      <p class="hint">整備が必要な理由：${esc(g.reason || '—')}</p>${g.troubles ? `<p class="hint">困っていること：${esc(g.troubles)}</p>` : ''}</section>
    ${r && r.merits.length ? `<section class="box"><h3>参加するメリット</h3><div class="tags">${r.merits.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <h3>報酬・特典</h3><ul class="plain">${r.rewards.length ? r.rewards.map(x => `<li><span class="tag sun">${REWARD_TYPES[x.type]}</span><span>${esc(x.text)}</span></li>`).join('') : '<li><span>報酬なし（ボランティア）</span></li>'}</ul></section>` : ''}
    <section><div class="section-title">場所</div>
      <div class="lmap small" id="detailMap"></div>
      <p class="hint" style="margin-top:6px">${exact ? `${I.pin(13)} 集合場所：${esc(g.addr)}（マッチングした人だけに表示しています）` : '安全のため、地図はおおよその範囲だけを表示しています。正確な場所と集合場所は、マッチング成立後にチャットで共有されます。'}</p></section>
    <section class="box"><h3>整備後の竹の利用予定</h3><div class="tags">${g.uses.map(x => `<span class="tag sky">${x}</span>`).join('') || '<span class="hint">未定（相談したい）</span>'}</div>${g.useNote ? `<p>${esc(g.useNote)}</p>` : ''}</section>
    <section class="box"><div class="who"><span class="avatar">${esc(o.name.slice(0, 1))}</span>${esc(o.name)}さん（所有者・管理者）</div></section>`;
  },

  /* ---------- 応募画面 ---------- */
  apply() {
    const g = grove(state.params.id), r = openReq(g), u = me();
    return `
    <div class="sum"><b>${esc(g.name)}</b><span>${esc(g.district)}・${rewardSummary(r)}</span></div>
    <form id="applyForm" novalidate>
      <div class="field"><span class="lbl">参加希望日<span class="req">必須</span></span>
        <div class="checks">${r.dates.map((d, i) => `<label class="check"><input type="radio" name="date" value="${d}" ${i === 0 ? 'checked' : ''}><span>${fmtDate(d)}<small>${esc(r.time)}${(u.days || []).includes(dowOf(d)) ? '・参加できる曜日' : ''}</small></span></label>`).join('')}</div></div>
      <div class="field"><span class="lbl">参加できる時間</span>
        <div class="checks three">${TIMES.map((t, i) => `<label class="check"><input type="radio" name="time" value="${t}" ${(u.times || [])[0] === t || (!(u.times || []).length && i === 0) ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></div>
      <div class="field"><span class="lbl">担当したい作業<span class="req">必須</span></span>
        <div class="stack">${r.tasks.map(t => { const e = eligible(t), T = TASKS[t.id]; return `<label class="check inline"><input type="checkbox" name="tasks" value="${t.id}" ${e.ok ? '' : 'disabled'} ${e.ok && (u.tasks || []).includes(t.id) ? 'checked' : ''}><span>${TASK_ICON[t.id](20)}<span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px"><span>${T.label}</span>${t.conds.length ? `<small class="${e.ok ? '' : 'risk2'}">${e.ok ? t.conds.map(c => CONDS[c].short).join('・') + '（条件を満たしています）' : '参加できません：' + e.why.join('・')}</small>` : `<small>${RISK[T.risk][0]}</small>`}</span></span></label>`; }).join('')}</div>
        <span class="hint">危険な作業は、条件を満たした人だけが選べます。プロフィールで経験・講習・資格を登録できます。</span></div>
      <div class="field"><span class="lbl">竹林作業の経験</span>
        <div class="checks three">${Object.entries(EXP).map(([k, v]) => `<label class="check"><input type="radio" name="exp" value="${k}" ${u.exp === k ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div></div>
      <div class="field"><span class="lbl">参加する目的</span>
        <div class="checks">${PURPOSES.map(p => `<label class="check sunny"><input type="checkbox" name="purposes" value="${p.id}" ${(u.purposes || []).includes(p.id) ? 'checked' : ''}><span>${p.label}</span></label>`).join('')}</div></div>
      <div class="field"><label for="ap-msg">所有者へのメッセージ<span class="opt">任意</span></label><textarea id="ap-msg" placeholder="例：竹について学びたくて応募しました。運搬なら力になれます。"></textarea></div>
      <div class="box warn"><label class="switch"><input type="checkbox" id="ap-safe">安全上の注意と参加条件を確認しました</label><p class="hint">${esc(r.safety || '安全管理者・所有者の指示に従ってください。')}</p></div>
      <div class="err" id="apErr" hidden></div>
    </form>`;
  },
  applied() {
    const g = grove(state.params.id), auto = !acc(g.ownerId).demo;
    return `<div class="done"><div class="badge">${I.check(44)}</div><h2>応募しました</h2>
      <p>所有者が応募内容を確認して承認すると、マッチング成立です。成立後はチャットで日時・集合場所・持ち物などを相談できます。</p>
      <div class="flow"><span>応募</span>→<span>承認</span>→<span>マッチング</span>→<span>チャット</span>→<span>活動</span>→<span>実績</span></div>
      ${auto ? '<p class="hint">（発表用：この竹林はサンプルなので、数秒後に自動で承認されます）</p>' : '<p class="hint">（発表用：所有者のデモアカウントでログインすると承認できます）</p>'}

  },

  /* ---------- 竹林の整備状況（所有者の竹林一覧） ---------- */
  groves() {
    const mine = db.groves.filter(isMine);
    return `
    <div class="row"><button class="btn" data-act="go" data-to="regGrove">${I.plus(20)}竹林を登録</button><button class="btn ghost" data-act="go" data-to="regReq">${I.list(20)}整備依頼を登録</button></div>
    <div class="cards">${mine.map(g => {
      const r = openReq(g), pend = r ? appsOfReq(r).filter(a => a.status === 'pending').length : 0;
      return `<button class="card" data-act="grovepage" data-id="${g.id}">
        <span class="card-top"><span class="thumb">${groveImg(g)}</span><span class="body"><span class="item-top"><h3>${esc(g.name)}</h3>${stBadge(g)}</span>
          <span class="prog">${STAGES[g.stage]}<span class="bar"><i style="width:${progress(g)}%"></i></span><b>${progress(g)}%</b></span>
          <span class="next-line">次に必要：<b>${g.next.map(t => TASKS[t].label).join('・') || '未定'}</b></span>
          <span class="meta">${r ? `<span>依頼：${datesText(r)}</span><span>決定 ${joined(r)}/${r.people}人</span>${pend ? `<span class="tag danger">応募 ${pend}件</span>` : ''}` : '<span>整備依頼なし</span>'}</span></span></span></button>`;
    }).join('') || '<div class="empty">まだ竹林を登録していません。「竹林を登録」から始めましょう。</div>'}</div>`;
  },

  /* ---------- 整備状況・活動履歴 ---------- */
  grove() {
    const g = grove(state.params.id), r = openReq(g), mine = isMine(g);
    const acts = db.acts.filter(a => a.groveId === g.id).sort((a, b) => b.date.localeCompare(a.date));
    const rApps = r ? appsOfReq(r) : [];
    return `
    <div class="card-top"><span class="thumb">${groveImg(g)}</span><span class="body" style="display:flex;flex-direction:column;gap:4px;min-width:0"><h2 style="font-size:20px">${esc(g.name)}</h2><span class="loc">${esc(g.district)}</span>${stBadge(g)}</span></div>
    <section class="box">
      <div class="item-top"><h3>整備状況</h3><span class="progress-big"><b>${progress(g)}</b>%</span></div>
      ${stagesHTML(g)}
      <p class="hint">いまの段階：<b>${STAGES[g.stage]}</b>。活動が終わるたびに更新され、次の担い手に引き継がれます。</p>
    </section>
    <section class="box sun"><h3>次に必要な整備</h3>
      <ul class="plain">${g.next.map(t => `<li><span class="next-mark">→</span><span>${TASKS[t].label}<span class="hint">（${RISK[TASKS[t].risk][0]}）</span></span></li>`).join('') || '<li><span class="hint">未定</span></li>'}</ul>
      ${g.issues ? `<p>残っている課題：${esc(g.issues)}</p>` : ''}
      ${mine ? (r ? '' : `<button class="btn" data-act="newreq" data-id="${g.id}">次の作業の整備依頼を登録する</button>`) : (r && groveStatus(g) === 'open' ? `<button class="btn" data-act="detail" data-id="${g.id}">続きの整備に参加する</button>` : '')}
    </section>
    ${r ? `<section class="box"><div class="item-top"><h3>募集中の整備依頼</h3>${stBadge(g)}</div>
      <p>${taskNames(r.tasks.map(t => t.id))}</p><p class="hint">${datesText(r)}・${esc(r.time)}・決定 ${joined(r)}/${r.people}人</p>
      ${mine ? `${rApps.length ? rApps.map(a => personRow(a)).join('') : '<p class="hint">まだ応募はありません。</p>'}
      <div class="row"><button class="btn ghost small" data-act="detail" data-id="${g.id}">掲載内容を見る</button><button class="btn quiet small" data-act="closereq" data-id="${r.id}">募集を終了する</button></div>` : `<button class="btn ghost small" data-act="detail" data-id="${g.id}">詳細を見る</button>`}
    </section>` : ''}
    <section><div class="section-title">活動履歴</div>
      ${g.log.length ? `<ul class="timeline">${[...g.log].reverse().map(l => `<li><time>${shortDate(l.date)}</time><span>${esc(l.text)}<br><span class="hint">${esc(l.by)}</span></span><span class="ok-mark">✓</span></li>`).join('')}</ul>` : '<div class="empty">まだ活動の記録はありません。</div>'}
    </section>
    ${acts.length ? `<section class="box"><h3>関わった担い手</h3><div class="tags">${[...new Set(acts.map(a => a.workerId))].map(id => `<span class="tag">${esc(acc(id).name)}さん（${acts.filter(a => a.workerId === id).length}回）</span>`).join('')}</div><p class="hint">複数の担い手が、竹林の続きを引き継いでいます。</p></section>` : ''}
    ${mine ? `<button class="btn ghost" data-act="recordgo" data-id="${g.id}">${I.cycle(20)}整備した竹を記録して活用先を探す</button>` : ''}`;
  },

  /* ---------- 竹林登録 ---------- */
  regGrove() {
    const L1 = state.regLoc;
    return `
    <form id="groveForm" novalidate>
      <button type="button" class="btn ghost small" style="align-self:flex-start" data-act="fillgrove">発表用のサンプルを入力</button>
      <fieldset class="fs"><legend>竹林の場所と規模</legend>
        <div class="field"><label for="g-name">竹林名<span class="req">必須</span></label><input type="text" id="g-name" placeholder="例：宝田町の裏山の竹林"></div>
        <div class="field"><label for="g-district">地区名（公開されます）</label><input type="text" id="g-district" placeholder="例：阿南市 宝田地区"></div>
        <div class="field"><span class="lbl">竹林の場所<span class="req">必須</span></span>
          <div class="lmap small" id="regMap"></div>
          <div class="map-tools"><span id="regLocLabel">${L1 ? `ピンの位置：${L1.lat.toFixed(4)}, ${L1.lng.toFixed(4)}` : '地図をタップしてピンを立ててください'}</span><button type="button" class="link" data-act="reggps">${I.gps(14)} 現在地</button></div>
          <span class="hint">正確な位置は公開されません。検索画面では「おおよその範囲」だけが表示され、マッチングした人にだけ共有されます。</span></div>
        <div class="field"><label for="g-addr">集合場所・目印（マッチング後に共有）</label><input type="text" id="g-addr" placeholder="例：竹田さん宅の裏・駐車場あり"></div>
        <div class="field"><label for="g-size">竹林の規模</label><div class="pair"><input type="number" id="g-size" min="1" inputmode="decimal" placeholder="例：900"><select class="input" id="g-unit" style="flex:none;width:5.5em"><option value="m2">㎡</option><option value="tan">反</option></select></div></div>
      </fieldset>
      <fieldset class="fs"><legend>竹林の現在の状態</legend>
        <div class="pair"><select class="input" id="g-level" aria-label="荒れぐあい">${COND_LEVEL.map((c, i) => `<option value="${i}">${c}</option>`).join('')}</select>
          <select class="input" id="g-density" aria-label="竹の密度">${DENSITY.map((c, i) => `<option value="${i}">竹が${c}</option>`).join('')}</select></div>
        <label class="check inline"><input type="checkbox" id="g-fallen"><span>倒れた竹・枯れた竹がある</span></label>
        <div class="field"><label for="g-reason">整備が必要な理由</label><input type="text" id="g-reason" placeholder="例：竹が家や畑まで広がってきた"></div>
        <div class="field"><label for="g-troubles">現在困っていること</label><textarea id="g-troubles" placeholder="例：高齢で自分では竹を切ったり運んだりできない"></textarea></div>
        <div class="field"><span class="lbl">いまの整備の段階</span><select class="input" id="g-stage">${STAGES.map((s, i) => `<option value="${i}">${s}</option>`).join('')}</select></div>
        <div class="field"><span class="lbl">写真</span><label class="photo-drop" id="photoDrop"><input type="file" id="g-photo" accept="image/*" aria-label="竹林の写真を選ぶ">${state.regPhoto ? `<img src="${state.regPhoto}" alt="選んだ写真">` : `<span>${I.camera(34)}<br>タップして写真を選ぶ</span>`}</label></div>
      </fieldset>
      <fieldset class="fs"><legend>整備後の竹の利用予定</legend>
        <div class="checks">${USES.map(x => `<label class="check"><input type="checkbox" name="uses" value="${x}"><span>${x}</span></label>`).join('')}</div>
        <input type="text" id="g-usenote" placeholder="例：持ち帰りOK・商用利用は相談">
      </fieldset>
      <div class="err" id="gErr" hidden></div>
    </form>`;
  },

  /* ---------- 整備依頼の登録 ---------- */
  regReq() {
    const mine = db.groves.filter(isMine), pre = state.params.groveId || (mine.find(g => !openReq(g)) || mine[0] || {}).id;
    if (!mine.length) return `<div class="empty">先に竹林を登録してください。<br><br><button class="btn small" data-act="go" data-to="regGrove">竹林を登録する</button></div>`;
    const g0 = grove(pre);
    return `
    <form id="reqForm" novalidate>
      <button type="button" class="btn ghost small" style="align-self:flex-start" data-act="fillreq">発表用のサンプルを入力</button>
      <fieldset class="fs"><legend>どの竹林の依頼ですか？</legend>
        <select class="input" id="q-grove">${mine.map(g => `<option value="${g.id}" ${g.id === pre ? 'selected' : ''}>${esc(g.name)}${openReq(g) ? '（募集中の依頼あり）' : ''}</option>`).join('')}</select>
        <p class="hint" id="q-next">${g0 ? `この竹林で次に必要な作業：${g0.next.map(t => TASKS[t].label).join('・') || '未定'}` : ''}</p>
      </fieldset>
      <fieldset class="fs"><legend>してほしい作業</legend>
        <p class="hint">危険性の高い作業には、参加条件を必ず設定してください。初心者や学生でも参加できる作業もあわせて登録すると、担い手が集まりやすくなります。</p>
        <div class="stack" id="taskPick">${Object.entries(TASKS).map(([k, t]) => taskPickRow(k, t, g0 && g0.next.includes(k))).join('')}</div>
      </fieldset>
      <fieldset class="fs"><legend>人数・日時・負担度</legend>
        <div class="field"><label for="q-people">必要人数</label><div class="stepper"><button type="button" data-act="step" data-t="q-people" data-d="-1" aria-label="減らす">−</button><input type="number" id="q-people" value="4" min="1" max="50"><button type="button" data-act="step" data-t="q-people" data-d="1" aria-label="増やす">＋</button></div></div>
        <div class="field"><span class="lbl">希望する日時<span class="req">必須</span></span>
          <div class="pair"><input type="date" id="q-d1" min="${TODAY}" aria-label="第1希望日"><input type="date" id="q-d2" min="${TODAY}" aria-label="第2希望日（任意）"></div>
          <span class="hint">第2希望日は任意です</span>
          <select class="input" id="q-time">${['8:00〜12:00', '9:00〜12:00', '9:00〜15:00', '13:00〜16:00', '時間は相談'].map(t => `<option>${t}</option>`).join('')}</select></div>
        <div class="field"><span class="lbl">作業の負担度</span>
          <div class="checks three">${[1, 2, 3].map(b => `<label class="check sunny"><input type="radio" name="burden" value="${b}" ${b === 2 ? 'checked' : ''}><span>${burdenHTML(b)}<small>${BURDEN[b][1]}</small></span></label>`).join('')}</div></div>
      </fieldset>
      <fieldset class="fs"><legend>参加条件・安全上の注意</legend>
        <div class="field"><label for="q-terms">参加条件</label><input type="text" id="q-terms" placeholder="例：中学生以上（18歳未満は保護者の同意）"></div>
        <div class="field"><label for="q-safety">安全上の注意</label><textarea id="q-safety" placeholder="例：伐採中は半径10m以内に入らない。長袖・長ぐつ・軍手は必須。"></textarea></div>
      </fieldset>
      <fieldset class="fs"><legend>報酬・特典<span class="opt">任意</span></legend>
        <p class="hint">報酬は自由に設定できます。設定しなくても登録できます。</p>
        <div class="stack" id="rewardRows"></div>
        <button type="button" class="btn ghost small" style="align-self:flex-start" data-act="addreward">＋ 報酬・特典を追加</button>
        <span class="hint">例：「整備してくれたら1回3,000円」「たけのこを提供」「整備した竹を提供」「地域活動の実績として認定」</span>
        <div class="field"><span class="lbl">参加するメリット</span><div class="checks">${MERITS.map(x => `<label class="check"><input type="checkbox" name="merits" value="${x}"><span>${x}</span></label>`).join('')}</div></div>
      </fieldset>
      <div class="err" id="qErr" hidden></div>
    </form>`;
  },

  /* ---------- マッチング一覧 ---------- */
  matches() {
    const owner = isOwner(), all = myApps();
    const tabs = owner ? [['pending', '応募者'], ['matched', 'マッチング中'], ['done', '活動済み']] : [['pending', '応募中'], ['matched', 'マッチング中'], ['done', '活動済み']];
    const cur = state.tabs.matches || 'matched';
    const list = all.filter(a => cur === 'done' ? (a.status === 'done' || a.status === 'declined') : a.status === cur).sort((a, b) => b.created.localeCompare(a.created));
    return `
    <div class="seg" role="tablist">${tabs.map(([k, l]) => { const n = all.filter(a => a.status === k).length; return `<button role="tab" aria-selected="${cur === k}" data-act="mtab" data-t="${k}">${l}${k === 'pending' && owner && n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('')}</div>
    <div class="list">${list.length ? list.map(a => owner ? `<div class="item"><span class="item-top"><h3>${esc(groveOfApp(a).name)}</h3><span class="hint">${shortDate(a.date)}</span></span>${personRow(a)}</div>` : appItem(a)).join('')
      : `<div class="empty">${cur === 'pending' ? (owner ? '承認待ちの応募はありません。' : '応募中の活動はありません。') : cur === 'matched' ? 'マッチング中の相手はいません。' : 'まだ活動済みの記録はありません。'}</div>`}</div>
    ${!owner && cur !== 'done' ? '<button class="btn ghost" data-act="tab" data-to="search">竹林を探す</button>' : ''}`;
  },

  /* ---------- チャット ---------- */
  chat() {
    const a = app(state.params.id), g = groveOfApp(a), u = me();
    const other = acc(isOwner() ? a.workerId : g.ownerId);
    const ms = db.msgs.filter(m => m.appId === a.id);
    const act = db.acts.find(x => x.appId === a.id);
    return `
    <div class="chat-head"><span class="avatar">${esc(other.name.slice(0, 1))}</span>
      <span class="t"><b>${esc(other.name)}さん</b><small>${esc(g.name)}・${fmtDate(a.date)} ${esc(a.time)}・${taskNames(a.tasks)}</small></span>
      <button class="btn ghost small" data-act="detail" data-id="${g.id}">竹林</button></div>
    <div class="box sky"><b>${I.pin(14)} 集合場所：${esc(g.addr)}</b><span class="hint">マッチングした人だけに共有しています。${other.phone && a.status === 'matched' ? ` 当日の連絡先：${esc(other.phone)}` : ''}</span></div>
    ${isOwner() && a.status === 'matched' ? `<button class="btn sun" data-act="completego" data-id="${a.id}">活動が終わったら：活動完了を記録する</button>` : ''}
    ${act ? `<div class="box sun"><b>活動完了・竹林活動実績 +${act.pt}pt</b><span class="hint">${taskNames(act.tasks)}（${shortDate(act.date)}）</span></div>` : ''}
    <div class="msgs">${ms.map(m => {
      if (m.from === 'sys') return `<div class="msg sys"><span class="bub">${esc(m.text)}</span></div>`;
      const mine = m.from === u.id;
      return `<div class="msg ${mine ? 'me' : 'them'}">${mine ? '' : `<span class="from">${esc(acc(m.from).name)}</span>`}<span class="bub">${esc(m.text)}</span><time>${m.ts.slice(5).replace('-', '/')}</time></div>`;
    }).join('')}</div>`;
  },

  /* ---------- 活動完了の記録（所有者） ---------- */
  complete() {
    const a = app(state.params.id), g = groveOfApp(a), w = acc(a.workerId);
    return `
    <div class="sum"><b>${esc(w.name)}さん・${esc(g.name)}</b><span>${fmtDate(a.date)}・担当：${taskNames(a.tasks)}</span></div>
    <form id="doneForm" novalidate>
      <fieldset class="fs"><legend>今回の活動でできたこと</legend>
        <div class="checks">${Object.entries(TASKS).map(([k, t]) => `<label class="check"><input type="checkbox" name="did" value="${k}" ${a.tasks.includes(k) ? 'checked' : ''}><span>${TASK_ICON[k](18)}${t.label}</span></label>`).join('')}</div>
        <div class="field"><label for="d-hours">活動時間</label><select class="input" id="d-hours">${[1, 2, 3, 4, 5, 6, 8].map(h => `<option value="${h}" ${h === 3 ? 'selected' : ''}>${h}時間</option>`).join('')}</select></div>
        <div class="field"><label for="d-text">できたことのメモ</label><input type="text" id="d-text" placeholder="例：奥のエリアの倒れた竹を約30本整理"></div>
      </fieldset>
      <fieldset class="fs"><legend>竹林の整備状況を更新</legend>
        <div class="field"><span class="lbl">いまの整備の段階</span>
          <div class="checks three">${STAGES.map((s, i) => `<label class="check"><input type="radio" name="stage" value="${i}" ${i === Math.min(5, g.stage + 1) ? 'checked' : ''}><span>${s}<small>${Math.round(i / 5 * 100)}%</small></span></label>`).join('')}</div></div>
        <div class="field"><label for="d-issues">まだ残っている課題</label><input type="text" id="d-issues" value="${esc(g.issues)}" placeholder="例：入口付近の竹がまだ残っている"></div>
        <div class="field"><span class="lbl">次に必要な作業</span>
          <div class="checks">${Object.entries(TASKS).map(([k, t]) => `<label class="check sunny"><input type="checkbox" name="next" value="${k}" ${g.next.includes(k) && !a.tasks.includes(k) ? 'checked' : ''}><span>${t.label}</span></label>`).join('')}</div></div>
        <label class="switch"><input type="checkbox" id="d-continue" checked>次に必要な作業で、続けて整備依頼を募集する</label>
      </fieldset>
      <div class="preview" id="ptPreview"></div>
    </form>`;
  },
  done() {
    const p = state.params;
    return `<div class="done"><div class="badge">${I.check(44)}</div><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p>
      <div class="stack">${(p.buttons || []).map(b => `<button class="btn ${b.ghost ? 'ghost' : ''}" data-act="${b.act}" data-id="${b.id || ''}" data-to="${b.to || ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
  },

  /* ---------- 活動実績 ---------- */
  achieve() {
    const u = me(), pt = pointsOf(u.id), rk = rankOf(pt), acts = actsOf(u.id), tp = taskPoints(u.id), maxv = Math.max(40, ...Object.values(tp));
    const groves = new Set(acts.map(a => a.groveId)), cont = acts.filter(a => a.cont).length;
    const tried = new Set(acts.flatMap(a => a.tasks));
    const untried = Object.keys(TASKS).filter(t => !tried.has(t) && TASKS[t].risk < 2 && t !== 'other');
    return `
    <section class="rank-card">

  <fieldset class="fs"><legend>経験・できる作業</legend>
    <div class="field"><span class="lbl">竹林作業の経験</span><div class="checks three">${Object.entries(EXP).map(([k, v], i) => `<label class="check"><input type="radio" name="exp" value="${k}" ${(u.exp || 'none') === k ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div></div>

    <div class="field"><span class="lbl">作業の負担度（どこまでOK？）</span><div class="checks three">${[1, 2, 3].map(b => `<label class="check sunny"><input type="radio" name="wburden" value="${b}" ${(u.burden || 2) === b ? 'checked' : ''}><span>${burdenHTML(b)}<small>まで</small></span></label>`).join('')}</div></div>

function readWorkerFields(root) {

  return {
    purposes: all('purposes'), otherPurpose: root.querySelector('#w-other').value.trim(), area: root.querySelector('#w-area').value.trim(),
    days: all('days').map(Number), times: all('times'), exp: root.querySelector('[name=exp]:checked')?.value || 'none',
    course: root.querySelector('#w-course').checked, license: root.querySelector('#w-license').checked,

  };
}
function stagesHTML(g) {

function groveCard(g, withId) {

function lotItem(l) {

function filteredGroves() {
  const f = state.f, owner = isOwner();
  let list = db.groves.filter(g => f.status.has(groveStatus(g)));
  if (!owner) {
    const u = me();
    if (f.purposes.size) list = list.filter(g => { const r = openReq(g); return r && [...f.purposes].some(p => purposeHit(p, r, g)); });
    if (f.beginner) list = list.filter(g => { const r = openReq(g); return r && r.tasks.some(t => TASKS[t.id].risk === 0 && !t.conds.length); });
    if (f.tasks.size) list = list.filter(g => { const r = openReq(g); return r ? r.tasks.some(t => f.tasks.has(t.id)) : g.next.some(t => f.tasks.has(t)); });
    if (f.burden) list = list.filter(g => { const r = openReq(g); return !r || r.burden <= f.burden; });
    if (f.reward) list = list.filter(g => { const r = openReq(g); return r && r.rewards.some(x => x.type === f.reward); });
    if (f.day === 'mine') list = list.filter(g => { const r = openReq(g); return r && r.dates.some(d => (u.days || []).includes(dowOf(d))); });
    if (f.day === 'weekend') list = list.filter(g => { const r = openReq(g); return r && r.dates.some(d => [0, 6].includes(dowOf(d))); });
    if (f.day === 'month') list = list.filter(g => { const r = openReq(g); return r && r.dates.some(d => d.slice(0, 7) === TODAY.slice(0, 7)); });
    if (f.dist) list = list.filter(g => km(state.here, approx(g)) <= f.dist);
  }
  const first = g => openReq(g)?.dates[0] || '9999';
  const sorters = { match: (a, b) => (matchInfo(b).score - matchInfo(a).score) || first(a).localeCompare(first(b)), near: (a, b) => km(state.here, approx(a)) - km(state.here, approx(b)), date: (a, b) => first(a).localeCompare(first(b)) };
  return list.sort(sorters[f.sort] || sorters.near);
}

      commit();
      state.stack = []; state.screen = 'done';
      state.params = { title: '活動完了を記録しました', text: `${w.name}さんに竹林活動実績 +${pts.total}pt。「${g.name}」の整備状況を${progress(g)}%に更新しました。${created ? '次に必要な作業（' + taskNames(next) + '）の募集を始めました。前回の参加者も、新しい参加者も応募できます。' : ''}`, buttons: [{ act: 'grovepage', id: g.id, label: '整備状況・活動履歴を見る' }, { act: 'recordgo', id: g.id, label: '整備した竹を記録する', ghost: true }] };
      render(true);
    });
  },
  record() {
    const f = $('#lotForm'); if (!f) return;
    const read = () => ({ groveId: Number($('#k-grove')?.value || 0), count: Math.max(1, Number($('#k-count').value) || 1), age: $('#k-age').value, diam: $('#k-diam').value, cond: $('#k-cond').value, shape: $('#k-shape').value, note: $('#k-note').value.trim() });
    const upd = () => { $('#lotPreview').innerHTML = `<b>この竹のおすすめの活用先</b>${suggestUses(read()).map(s => `<div><span class="tag sky">${s.use}</span> ${s.why}</div>`).join('')}`; };
    f.addEventListener('change', upd); upd();
    f.addEventListener('submit', e => {
      e.preventDefault(); if (!$('#k-grove')) return;
      const l = { id: nextId(), by: me().id, date: TODAY, ...read() }; db.lots.push(l); commit();
      state.stack = [{ screen: 'bamboo', params: {} }]; state.screen = 'lot'; state.params = { id: l.id }; render(true);
      toast('竹を記録しました。おすすめの活用先を表示しています。');
    });
  },
  profile() {
    $('#profForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = readWorkerFields(e.target);
      if (!v.purposes.length) { toast('「なぜ竹林活動に参加したいですか？」を1つ以上選んでください'); return; }
      Object.assign(me(), v, { org: $('#p-org').value.trim() }); state.f.purposes = null; commit();
      toast('プロフィールを保存しました。おすすめに反映されます'); render(false);
    });
  },
};

function showErr(sel, msgs) { const e = $(sel); e.innerHTML = msgs.join('<br>'); e.hidden = false; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function login(u, isNew) {
  state.user = u; state.stack = []; state.screen = 'home'; state.params = {}; state.selected = null; state.tabs = {}; state.mapView = null; state.f = freshFilter();
  if (isOwner()) state.f.sort = 'near';
  render(true);
  toast(isNew ? `登録しました。ようこそ、${u.name}さん！` : `${u.name}さんとしてログインしました（${u.role === 'owner' ? '竹林所有者・農家' : '参加者'}）`);
}
function approveApp(a, auto) {
  if (!a || a.status !== 'pending') return;
  a.status = 'matched';
  const g = groveOfApp(a);
  db.msgs.push({ id: nextId(), appId: a.id, from: 'sys', text: `マッチングが成立しました。集合場所「${g.addr}」をお知らせします。活動日時・作業内容・持ち物・服装・注意事項などを相談しましょう。`, ts: nowTs() });
  if (auto) db.msgs.push({ id: nextId(), appId: a.id, from: g.ownerId, text: `ご応募ありがとうございます！${fmtDate(a.date)}、よろしくお願いします。わからないことは何でも聞いてください。`, ts: nowTs() });
  commit();
}
function sendMsg(appId, from, text) {
  db.msgs.push({ id: nextId(), appId, from, text, ts: nowTs() }); commit();
  if (state.screen === 'chat' && state.params.id === appId) { render(false); window.scrollTo(0, document.body.scrollHeight); }
  const a = app(appId), g = groveOfApp(a), r = req(a.reqId);
  const otherId = from === g.ownerId ? a.workerId : g.ownerId, other = acc(otherId);
  // 相手がサンプルアカウントなら自動で返信（発表用）
  if (from === me()?.id && !other.demo && !other.id.startsWith('u')) {
    const reply = /日|時/.test(text) ? `はい、${fmtDate(a.date)} ${r.time}でお願いします！` : /集合|場所|駐車/.test(text) ? `${g.addr}に集合でお願いします。` : /持ち物|何が/.test(text) ? '軍手・飲み物・タオルをお願いします。道具は貸し出します。' : /服装/.test(text) ? '長袖・長ズボン・長ぐつ（なければ運動靴）でお願いします。' : /安全|注意/.test(text) ? (r.safety || '作業前に安全説明をします。') : /連絡/.test(text) ? '当日の連絡はこのチャットでお願いします。雨の場合は朝7時までに連絡します。' : 'ありがとうございます。当日よろしくお願いします！';
    setTimeout(() => sendMsg(appId, otherId, reply), 1300);
  }
}
function fillGrove() {
  const v = (id, x) => { const el = document.getElementById(id); if (el) el.value = x; };
  v('g-name', '見能林町・田んぼ横の竹林'); v('g-district', '阿南市 見能林地区'); v('g-addr', '田んぼの北側の農道（車2台とめられます）'); v('g-size', '1.5'); v('g-unit', 'tan');
  v('g-level', '0'); v('g-density', '0'); $('#g-fallen').checked = true; v('g-reason', '竹が田んぼの日当たりをさえぎっている'); v('g-troubles', '高齢で、自分では竹を切ったり運んだりできない。どこから手をつければよいかわからない。'); v('g-stage', '0');
  $$('#groveForm [name=uses]').forEach(c => c.checked = ['メンマ（食品）', '竹炭'].includes(c.value)); v('g-usenote', '持ち帰り自由・商用利用もOK');
  AFTER._place && AFTER._place({ lat: 33.9010, lng: 134.6700 }); $('#gErr').hidden = true; toast('サンプルを入力しました。写真は自由に選べます。');
}
function fillReq() {
  $$('#reqForm [name=rtask]').forEach(c => { c.checked = ['survey', 'photo', 'clean', 'pro'].includes(c.value); c.dispatchEvent(new Event('change', { bubbles: true })); });
  $('#q-people').value = 5; $('#q-d1').value = nextDow(6, 1); $('#q-d2').value = nextDow(0, 1); $('#q-time').value = '9:00〜12:00';
  $$('#reqForm [name=burden]').forEach(c => c.checked = c.value === '1');
  $('#q-terms').value = '中学生以上（18歳未満は保護者の同意）'; $('#q-safety').value = '伐採は経験者のみ・管理者の立ち会いのもとで行います。それ以外の方は伐採エリアに入らないでください。';
  $('#rewardRows').innerHTML = rewardRow('money', '整備してくれたら1回 2,000円') + rewardRow('shoot', '春にたけのこを提供') + rewardRow('cert', '地域活動の実績として認定');
  $$('#reqForm [name=merits]').forEach(c => c.checked = ['初心者歓迎', '地域貢献になる', '経験・実績になる'].includes(c.value));
  $('#qErr').hidden = true; toast('サンプルを入力しました。');
}

/* ---------- シート ---------- */
function renderSheet() {
  const el = $('#sheet'), sh = state.sheet;
  if (!sh) { el.innerHTML = ''; return; }
  const wrap = (h, inner) => `<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${h}" data-stop><span class="grab"></span><h2>${h}</h2>${inner}</div></div>`;
  if (sh.type === 'profile') {
    const a = app(sh.id), w = acc(a.workerId), pt = pointsOf(w.id), rk = rankOf(pt), acts = actsOf(w.id);
    el.innerHTML = wrap(`${esc(w.name)}さんの応募内容`, `
      <div class="sum"><div>${esc(w.org || '所属なし')}・${esc(w.area || '')}</div><div>竹林活動実績 <b class="plus">${pt}pt</b>（${rk.cur.name}）・活動${acts.length}回・継続参加${acts.filter(x => x.cont).length}回</div></div>
      <dl class="stack">
        <div><dt class="hint">参加希望日・時間</dt><dd style="margin:0">${fmtDate(a.date)}・${esc(a.time)}</dd></div>
        <div><dt class="hint">担当したい作業</dt><dd style="margin:0">${taskNames(a.tasks)}</dd></div>
        <div><dt class="hint">経験</dt><dd style="margin:0">${EXP[a.exp]}${w.course ? '・安全講習受講済み' : ''}${w.license ? '・資格あり' : ''}</dd></div>
        <div><dt class="hint">参加目的</dt><dd style="margin:0"><div class="tags">${(a.purposes || []).map(p => `<span class="tag sun">${PURPOSE[p].label}</span>`).join('') || '—'}</div></dd></div>
        <div><dt class="hint">経験した活動</dt><dd style="margin:0"><div class="tags">${[...new Set(acts.flatMap(x => x.tasks))].map(t => `<span class="tag">${TASKS[t].label}</span>`).join('') || '<span class="hint">はじめての参加</span>'}</div></dd></div>
        ${a.msg ? `<div><dt class="hint">メッセージ</dt><dd style="margin:0">${esc(a.msg)}</dd></div>` : ''}
      </dl>
      ${a.status === 'pending' && isOwner() ? `<div class="row"><button class="btn quiet" data-act="decline" data-id="${a.id}">見送る</button><button class="btn" data-act="approve" data-id="${a.id}">承認する</button></div>` : '<button class="btn ghost" data-act="closesheet">閉じる</button>'}`);
  } else if (sh.type === 'reset') {
    el.innerHTML = wrap('デモデータを最初の状態に戻しますか？', `<p class="hint">この端末に保存した竹林・アカウント・チャット・実績などがすべて消えて、サンプルデータに戻ります。</p>
      <div class="row"><button class="btn ghost" data-act="closesheet">やめる</button><button class="btn" style="background:var(--danger)" data-act="confirmreset">最初の状態に戻す</button></div>`);
  } else if (sh.type === 'closereq') {
    el.innerHTML = wrap('この整備依頼の募集を終了しますか？', `<p class="hint">マッチング中の参加者とのやりとりは続けられます。新しい応募は受け付けなくなります。</p>
      <div class="row"><button class="btn ghost" data-act="closesheet">やめる</button><button class="btn" data-act="confirmclosereq" data-id="${sh.id}">募集を終了する</button></div>`);
  }
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'closesheet' && t.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  const id = Number(t.dataset.id), A = t.dataset.act;
  switch (A) {
    case 'back': back(); break;
    case 'tab': if (t.dataset.tab) state.tabs.matches = t.dataset.tab; tab(t.dataset.to); break;
    case 'go': go(t.dataset.to); break;
    case 'detail': go('detail', { id }); break;
    case 'grovepage': go('grove', { id }); break;
    case 'chat': go('chat', { id }); break;
    case 'lot': go('lot', { id }); break;
    case 'applygo': go('apply', { id }); break;
    case 'completego': go('complete', { id }); break;
    case 'newreq': go('regReq', { groveId: id }); break;
    case 'recordgo': go('record', { groveId: id || undefined }); break;
    case 'authtab': state.authTab = t.dataset.t; state.signupRole = null; render(false); break;
    case 'pickrole': state.signupRole = t.dataset.r; render(true); break;
    case 'unpick': state.signupRole = null; render(true); break;
    case 'demologin': login(acc(t.dataset.id)); break;
    case 'logout': state.user = null; state.authTab = 'login'; try { localStorage.removeItem(USER_KEY); } catch (x) {} render(true); toast('ログアウトしました'); break;
    case 'reset': state.sheet = { type: 'reset' }; renderSheet(); break;
    case 'confirmreset': db = seedDB(); commit(); state.sheet = null; state.user = null; try { localStorage.removeItem(USER_KEY); } catch (x) {} render(true); toast('デモデータを最初の状態に戻しました'); break;
    case 'closesheet': state.sheet = null; renderSheet(); break;
    case 'purposego': state.f = freshFilter(); state.f.purposes = new Set([t.dataset.p]); tab('search'); break;
    case 'searchgo': state.f = freshFilter(); if (t.dataset.mode === 'all') { state.f.purposes = new Set(); state.f.sort = 'near'; } tab('search'); break;
    case 'trytask': state.f = freshFilter(); state.f.purposes = new Set(); state.f.tasks = new Set([t.dataset.t]); tab('search'); break;
    case 'fpurpose': { state.mapView = null; const s = state.f.purposes, p = t.dataset.p; s.has(p) ? s.delete(p) : s.add(p); render(false); break; }
    case 'ftask': { state.mapView = null; const s = state.f.tasks, k = t.dataset.t; s.has(k) ? s.delete(k) : s.add(k); render(false); break; }
    case 'fstatus': { state.mapView = null; const s = state.f.status, k = t.dataset.s; s.has(k) ? s.delete(k) : s.add(k); render(false); break; }
    case 'gps': case 'reggps': {
      if (!navigator.geolocation) { toast('この端末では現在地を取得できません'); break; }
      toast('現在地を取得しています…');
      navigator.geolocation.getCurrentPosition(p => {
        const ll = { lat: p.coords.latitude, lng: p.coords.longitude };
        if (A === 'gps') { state.here = { ...ll, label: '現在地' }; state.mapView = null; render(false); toast('現在地から距離を計算しました'); }
        else { AFTER._place && AFTER._place(ll); toast('現在地にピンを立てました'); }
      }, () => toast('現在地を取得できませんでした。位置情報の許可を確認してください。'), { timeout: 8000 });
      break;
    }
    case 'approve': approveApp(app(id)); state.sheet = null; toast('承認しました。マッチング成立です。チャットで日程を相談しましょう'); render(false); break;
    case 'decline': app(id).status = 'declined'; commit(); state.sheet = null; toast('今回は見送りにしました'); render(false); break;
    case 'profilesheet': state.sheet = { type: 'profile', id }; renderSheet(); break;
    case 'closereq': state.sheet = { type: 'closereq', id }; renderSheet(); break;
    case 'confirmclosereq': { const r = req(id); r.status = 'closed'; db.apps.filter(a => a.reqId === r.id && a.status === 'pending').forEach(a => a.status = 'declined'); commit(); state.sheet = null; render(false); toast('募集を終了しました'); break; }
    case 'mtab': state.tabs.matches = t.dataset.t; render(false); break;
    case 'tpl': { const inp = $('#chatInput'); inp.value = chatTemplates[t.dataset.k] || ''; inp.focus(); break; }
    case 'addreward': $('#rewardRows').insertAdjacentHTML('beforeend', rewardRow('shoot', '')); break;
    case 'delreward': t.closest('.reward-row').remove(); break;
    case 'step': { const inp = document.getElementById(t.dataset.t); inp.value = Math.min(Number(inp.max) || 50, Math.max(Number(inp.min) || 0, (Number(inp.value) || 0) + Number(t.dataset.d))); break; }
    case 'fillgrove': fillGrove(); break;
    case 'fillreq': fillReq(); break;
    case 'link': db.links.push({ id: nextId(), lotId: Number(t.dataset.lot), demandId: Number(t.dataset.d), userId: null, date: TODAY }); commit(); render(false); toast('事業者に竹の情報を送りました（デモ）。相談中として表示されます'); break;
    case 'wantlot': db.links.push({ id: nextId(), lotId: id, demandId: null, userId: me().id, date: TODAY }); commit(); render(false); toast('所有者に「この竹を使いたい」と伝えました（デモ）'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderSheet(); } });

render(true);
</script>
</body>
</html>
