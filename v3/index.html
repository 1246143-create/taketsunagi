<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6a3e">
<title>竹つなぎ</title>
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+1p:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: phone-width app column — sticky top bar / page content / sticky action bar + tab nav */
:root{
  --outer:#dfe8d8; --bg:#f2f6ee; --surface:#ffffff; --ink:#1d2b20; --muted:#5b6b5e; --line:#dae4d3;
  --bamboo:#2d6a3e; --bamboo-soft:#e0eed9; --on-bamboo:#ffffff; --leaf:#7fae2e;
  --sun:#c98512; --sun-soft:#fbefd6; --sky:#2f7fd1; --sky-soft:#e3eefa; --danger:#b3412f; --danger-soft:#f8e3df;
  --shadow:0 1px 2px rgba(29,43,32,.06),0 4px 14px rgba(29,43,32,.06);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"M PLUS 1p","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --outer:#0c110d;--bg:#121914;--surface:#1a241d;--ink:#e4ede2;--muted:#9baa9d;--line:#2a392e;
  --bamboo:#72c488;--bamboo-soft:#20362a;--on-bamboo:#0d1a11;--leaf:#a5d45a;--sun:#f0b650;--sun-soft:#3a2f18;
  --sky:#7db4ee;--sky-soft:#1c2c3d;--danger:#f08a78;--danger-soft:#3b2220;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;display:flex;justify-content:center}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone は16px未満の入力欄をタップすると画面を拡大してしまうので16pxにそろえる */
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
p{margin:0}

.app{position:relative;width:100%;max-width:440px;overflow-x:clip;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
@media (max-width:479px){body{background:var(--bg)}}
@media (min-width:480px){.app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12)}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;color:var(--bamboo);flex:1}
.brand img{width:38px;height:38px;border-radius:10px;display:block}
.brand span{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.04em}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;margin-left:-8px}
.icon-btn:hover{background:var(--bamboo-soft)}
.chip-top{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--sun-soft);color:var(--sun);font-weight:700;font-size:12.5px;border:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip-top.owner{background:var(--bamboo-soft);color:var(--bamboo)}

#view{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:20px}
.dock{position:sticky;bottom:0;z-index:1000;width:100%;min-width:0}
#action{min-width:0;overflow:hidden;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.tabnav{display:grid;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 9px;font-size:10.5px;color:var(--muted);position:relative}
.tabnav button[aria-current="page"]{color:var(--bamboo);font-weight:700}
.tabnav .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:10px 18px;border-radius:12px;border:0;font-weight:700;font-size:16px;background:var(--bamboo);color:var(--on-bamboo);text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--bamboo);box-shadow:inset 0 0 0 1.5px var(--bamboo)}
.btn.quiet{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sun{background:var(--sun);color:var(--on-bamboo)}
.btn.small{min-height:38px;font-size:14px;padding:6px 14px;width:auto;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.section-title{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:10px}
.section-title a,.link{font-size:13px;color:var(--bamboo);font-weight:700;background:none;border:0;padding:0;letter-spacing:0}
.note{font-size:12px;color:var(--muted);text-align:center}
.hint{font-size:12.5px;color:var(--muted)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);border:1px dashed var(--line);font-size:14px}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;background:var(--bamboo);color:var(--on-bamboo);padding:22px 20px 20px;display:flex;flex-direction:column;gap:6px}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero>*:not(svg){position:relative}
.hero .hello{font-size:13px;font-weight:700;opacity:.9}
.hero h2{font-size:23px;font-weight:900}
.hero p{font-size:13.5px;opacity:.92}
.big-choice{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:0;text-align:left;background:var(--surface);box-shadow:var(--shadow);width:100%}
.big-choice .ic{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.big-choice.primary{background:var(--bamboo);color:var(--on-bamboo)}
.big-choice.primary .ic{background:rgba(255,255,255,.16);color:var(--on-bamboo)}
.big-choice b{display:block;font-family:var(--f-display);font-size:18px}
.big-choice small{display:block;font-size:12.5px;opacity:.8;line-height:1.5}
.big-choice .arr{margin-left:auto;flex:none}
.stack{display:grid;gap:10px}

/* chips & tags */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--bamboo-soft);color:var(--bamboo);white-space:nowrap}
.tag.sun{background:var(--sun-soft);color:var(--sun)}
.tag.sky{background:var(--sky-soft);color:var(--sky)}
.tag.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--bamboo);border-color:var(--bamboo);color:var(--on-bamboo)}
.chip.purpose[aria-pressed="true"]{background:var(--sun);border-color:var(--sun)}
.burden{display:inline-flex;gap:2px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.burden i{width:7px;height:12px;border-radius:2px;background:var(--line);display:inline-block}
.burden i.on{background:var(--sun)}

/* map */
.lmap{height:250px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--bamboo-soft);z-index:0}
.lmap.tall{height:300px}
.map-fallback{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.lpin{background:none;border:0}
.lpin .t{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--surface);color:var(--bamboo);font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap;font-family:var(--f-body)}
.lpin.sel .t{background:var(--bamboo);color:var(--on-bamboo)}
.lpin.mine .t{color:var(--sun)}
.lpin svg{position:absolute;left:0;bottom:0;width:28px;height:34px}
.lme{width:18px;height:18px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,127,209,.25)}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;margin:10px 12px}
.leaflet-popup-content .btn{margin-top:6px;min-height:34px;font-size:13px}
.map-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}

/* search */
.panel{background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:14px;color:var(--muted);font-family:var(--f-body)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
.sel{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;min-height:40px;width:100%}
.toolbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.count{font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--bamboo);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:12px}

/* cards */
.cards{display:grid;gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid transparent;text-align:left;width:100%}
.card.sel{border-color:var(--bamboo)}
.card-top{display:flex;gap:12px}
.thumb{flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.match{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--sun-soft);font-size:12.5px}
.match b{font-family:var(--f-display);font-size:17px;color:var(--sun);font-variant-numeric:tabular-nums;flex:none}
.match span{min-width:0}
.rewards{display:flex;flex-wrap:wrap;gap:4px}

/* detail */
.banner{border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.banner svg,.banner img{width:100%;height:100%;display:block;object-fit:cover}
.d-head{display:flex;flex-direction:column;gap:6px}
.d-head h2{font-size:22px}
.loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.kvs{background:var(--surface);border-radius:var(--r);padding:2px 16px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:6.8em 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv dt{font-size:13px;color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:500;min-width:0;font-variant-numeric:tabular-nums}
dl{margin:0}
.bar{height:8px;border-radius:99px;background:var(--bamboo-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--bamboo);border-radius:99px}
.bar.sun{background:var(--sun-soft)}
.bar.sun i{background:var(--sun)}
.box{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:8px}
.box.sun{background:var(--sun-soft);border-color:transparent}
.box.warn{background:var(--danger-soft);border-color:transparent}
.box h3{font-size:15px}
.reward-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.reward-list li{display:flex;gap:8px;align-items:baseline}
.task-list{display:grid;gap:8px}
.task-row{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.task-row .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--bamboo-soft);color:var(--bamboo)}
.task-row b{display:block}
.task-row span{font-size:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--bamboo-soft);color:var(--bamboo);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.who{display:flex;align-items:center;gap:8px;font-weight:700}

/* forms */
form{display:flex;flex-direction:column;gap:18px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
legend{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--bamboo);padding:0;margin-bottom:12px}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.req{font-size:11px;color:#fff;background:var(--danger);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:700}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select.input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--bamboo);outline:none}
textarea{min-height:76px;resize:vertical}
.pair{display:flex;gap:8px}
.pair>*{min-width:0;flex:1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.checks.three{grid-template-columns:repeat(3,1fr)}
.check{position:relative}
.check input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.check>span{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;height:100%;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--muted);line-height:1.35}
.check>span small{font-weight:500;font-size:11px}
.check input:checked+span{border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo)}
.check.sunny input:checked+span{border-color:var(--sun);background:var(--sun-soft);color:var(--sun)}
.check input:focus-visible+span{outline:3px solid var(--leaf);outline-offset:2px}
.check.inline>span{flex-direction:row;padding:8px 10px}
.photo-drop{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border-radius:14px;border:2px dashed var(--line);background:var(--bg);color:var(--muted);overflow:hidden;text-align:center;font-size:14px}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:max-content}
.stepper button{width:44px;height:42px;border:0;background:none;font-size:22px;color:var(--bamboo)}
.stepper input{width:60px;border:0!important;text-align:center;min-height:42px!important;background:none!important;font-weight:700;font-size:17px;padding:0!important}
.reward-row{display:flex;gap:6px}
.reward-row select{flex:none;width:8.5em}
.reward-row input{flex:1;min-width:0}
.reward-row button{flex:none;width:40px;border:0;background:none;color:var(--muted);font-size:20px}
.err{color:var(--danger);font-size:13px;font-weight:700}
.preview{border-radius:12px;background:var(--sun-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

/* lists */
.list{display:grid;gap:10px}
.item{background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-top h3{font-size:16px;min-width:0}
.status{flex:none;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.st-pending{background:var(--sun-soft);color:var(--sun)}
.st-matched{background:var(--bamboo-soft);color:var(--bamboo)}
.st-done{background:var(--line);color:var(--muted)}
.st-declined{background:var(--danger-soft);color:var(--danger)}
.applicant{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px dashed var(--line);flex-wrap:wrap}
.applicant .nm{flex:1;min-width:8em;background:none;border:0;padding:0;text-align:left}
.applicant .nm b{display:block;font-size:14px}
.applicant .nm small{color:var(--muted);font-size:12px}
.applicant .acts{display:flex;gap:6px}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:3.6em 1fr auto;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:baseline;font-size:14px}
.timeline time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plus{color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums}

/* profile & ranks */
.profile{display:flex;align-items:center;gap:12px}
.profile .avatar{width:50px;height:50px;font-size:19px}
.profile b{font-family:var(--f-display);font-size:18px;display:block}
.profile span{font-size:13px;color:var(--muted)}
.rank-card{border-radius:18px;padding:18px;background:var(--bamboo);color:var(--on-bamboo);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.rank-card .lab{font-size:13px;opacity:.88}
.rank-card .val{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.rank-card .val small{font-size:17px;margin-left:4px}
.rank-card .rank{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px;width:max-content}
.rank-card .bar{background:rgba(255,255,255,.22);height:10px}
.rank-card .bar i{background:var(--on-bamboo)}
.rank-card .next{font-size:13px;opacity:.95}
.rank-card svg.deco{position:absolute;right:-12px;top:-12px;width:130px;height:130px;opacity:.16}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:22px;color:var(--bamboo);font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:11.5px;color:var(--muted)}
.catbars{display:grid;gap:10px}
.catbar{display:grid;grid-template-columns:6.5em 1fr 3.4em;gap:10px;align-items:center;font-size:13.5px}
.catbar .bar{margin:0;height:10px}
.catbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.catbar.zero span:first-child{color:var(--muted)}
.seg{display:grid;background:var(--bamboo-soft);border-radius:12px;padding:4px;gap:4px;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--bamboo);box-shadow:var(--shadow)}

/* chat */

.msg time{font-size:11px;color:var(--muted)}
.msg.me{align-self:flex-end;align-items:flex-end}

.msg.them .bub{border-bottom-left-radius:4px}
.msg .from{font-size:12px;color:var(--muted);font-weight:700}
.msg.sys{align-self:center;max-width:94%;text-align:center}
.msg.sys .bub{background:var(--sun-soft);border:0;font-size:13px;color:var(--ink);border-radius:10px}
.chatbar{display:flex;gap:8px;flex-direction:row}

.chatbar .btn{width:auto;min-height:44px;padding:0 16px}
.thread{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.thread .t{flex:1;min-width:0}
.thread b{display:block;font-size:15px}
.thread small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.demand b{display:block;font-size:14.5px}
.demand small{display:block;color:var(--muted);font-size:12.5px}

.role-card input:checked+span{border-color:var(--bamboo);background:var(--bamboo-soft)}
.role-card input:checked+span .ic{background:var(--bamboo);color:var(--on-bamboo)}
.role-card input:focus-visible+span{outline:3px solid var(--leaf);outline-offset:2px}
.divider{border-top:1px dashed var(--line);padding-top:16px}

/* done */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:24px}

.done h2{font-size:22px}
.done p{color:var(--muted);max-width:30em}

.scrim{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(10,20,12,.45);display:flex;align-items:flex-end;z-index:2000}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}

.toast.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function km(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function matchInfo(g, u = state.user) {
  if (!u || u.role !== 'worker') return { score: 0, hits: [] };
  const ps = u.purposes || [];
  const hits = ps.filter(p => PURPOSE[p].test(g));
  const catHit = (u.cats || []).filter(c => g.cats.includes(c));
  const d = km(state.here, g);
  let score = 15 + (ps.length ? hits.length / ps.length * 55 : 25) + (catHit.length ? 15 : 0) + (d < 5 ? 15 : d < 10 ? 8 : 0);
  return { score: Math.min(99, Math.round(score)), hits, catHit };
}

function photo(seed) {
  let s = seed * 9301 + 49297;
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const sky = ['#cfe6c0', '#d9ecc6', '#c6e2c9', '#e1eec2'][seed % 4];
  let stalks = '', leaves = '';
  for (let i = 0; i < 11; i++) {
    const x = 6 + i * 14.5 + r() * 8, w = 3 + r() * 3.5, shade = ['#5e9a3f', '#4d8a37', '#6fae47', '#3f7a31'][Math.floor(r() * 4)];
    stalks += `<rect x="${x.toFixed(1)}" y="-2" width="${w.toFixed(1)}" height="104" fill="${shade}"/>`;
    for (let y = 12 + r() * 14; y < 100; y += 22 + r() * 6) stalks += `<rect x="${(x - .6).toFixed(1)}" y="${y.toFixed(1)}" width="${(w + 1.2).toFixed(1)}" height="1.6" fill="#2f5e25" opacity=".7"/>`;
  }
  for (let i = 0; i < 26; i++) {
    const x = r() * 160, y = r() * 45, a = -40 + r() * 80;
    leaves += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="9" ry="2.4" fill="${r() > .5 ? '#7cb84e' : '#98c95c'}" transform="rotate(${a.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;
  }
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="100" fill="${sky}"/><rect y="82" width="160" height="18" fill="#a9c77d"/>${stalks}${leaves}</svg>`;
}

        <button class="big-choice" data-act="demologin" data-id="worker"><span class="ic">${CAT_ICON.seibi(26)}</span><span><b>参加者として</b><small>阿南 太郎さん（阿南高専・実績${pointsOf('worker')}pt）</small></span><span class="arr">${I.arrow}</span></button>

    <form id="signupForm" novalidate>
      <div class="field">

        <span class="hint">目的に合う竹林が「おすすめ」に表示されます</span></div>
      <div class="field" data-for="worker" hidden><span class="lbl">やってみたい活動</span>
        <div class="checks">${Object.entries(CATS).map(([k, c]) => `<label class="check"><input type="checkbox" name="cats" value="${k}"><span>${CAT_ICON[k](22)}${c.label}</span></label>`).join('')}</div></div>
      <div class="field" data-for="worker" hidden><label for="s-org">学校・所属・仕事（任意）</label><input type="text" id="s-org" placeholder="例：阿南高専 / 竹細工職人"></div>

  /* ---------- ホーム ---------- */
  home() {
    const u = state.user;
    if (isOwner()) {
      const mine = db.groves.filter(isMine);
      const pend = pendingForOwner();
      return `
      <section class="hero">${heroArt}
        <p class="hello">こんにちは、${esc(u.name)}さん</p>
        <h2>竹林の「してほしい」を<br>登録しよう</h2>
        <p>作業内容と報酬を決めると、目的の合う参加者から応募が届きます。</p>
      </section>
      <div class="stats">
        <div class="stat"><b>${mine.length}</b><span>登録した竹林</span></div>
        <div class="stat"><b>${pend.length}</b><span>承認待ちの応募</span></div>
        <div class="stat"><b>${myThreads().filter(a => a.status === 'matched').length}</b><span>やりとり中</span></div>
      </div>
      <button class="big-choice primary" data-act="tab" data-to="register"><span class="ic">${I.plus(28)}</span><span><b>竹林を登録する</b><small>場所・作業・報酬・条件を設定</small></span><span class="arr">${I.arrow}</span></button>
      <section>
        <div class="section-title">承認待ちの応募</div>
        ${pend.length ? `<div class="list">${pend.map(a => applicantRow(a, true)).join('')}</div>` : '<div class="empty">いま承認待ちの応募はありません。</div>'}
      </section>
      <section>
        <div class="section-title">登録した竹林<button class="link" data-act="tab" data-to="mypage">すべて見る</button></div>
        <div class="cards">${mine.map(g => groveCard(g)).join('') || '<div class="empty">まだ登録した竹林はありません。</div>'}</div>
      </section>
      <button class="big-choice" data-act="tab" data-to="bamboo"><span class="ic">${I.cycle(26)}</span><span><b>整備した竹を活用する</b><small>竹の状態を記録して、竹を必要とする事業者につなぐ</small></span><span class="arr">${I.arrow}</span></button>`;
    }
    const pt = pointsOf(u.id), rk = rankOf(pt);
    const rec = db.groves.filter(g => !isFull(g) && g.date >= TODAY && !db.apps.some(a => a.groveId === g.id && a.workerId === u.id))
      .map(g => ({ g, m: matchInfo(g) })).sort((a, b) => b.m.score - a.m.score).slice(0, 3);
    const tried = new Set(actsOf(u.id).flatMap(a => a.cats));
    const untried = Object.keys(CATS).filter(c => !tried.has(c));
    return `
    <section class="hero">${heroArt}
      <p class="hello">こんにちは、${esc(u.name)}さん</p>
      <h2>あなたの「やりたい」に<br>合う竹林があります</h2>
      <p>目的：${(u.purposes || []).map(p => PURPOSE[p].short).join('・') || '未設定'}</p>
    </section>
    <button class="rank-card" style="border:0;text-align:left" data-act="tab" data-to="mypage">
      <svg class="deco" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><path d="M11 3v26M21 3v26M8 10h6M8 19h6M18 7h6M18 16h6M18 25h6"/></svg>
      <span class="lab">竹林活動実績</span>
      <span class="val">${num(pt)}<small>pt</small></span>
      <span class="rank">ランク：${rk.cur.name}</span>
      ${rk.next ? `<span class="bar"><i style="width:${((pt - rk.cur.min) / (rk.next.min - rk.cur.min) * 100).toFixed(0)}%"></i></span><span class="next">あと${rk.next.min - pt}ptで「${rk.next.name}」・今月${monthCount(u.id)}回活動</span>` : ''}
    </button>
    <section>
      <div class="section-title">あなたへのおすすめ<button class="link" data-act="tab" data-to="search">もっと見る</button></div>
      <div class="cards">${rec.map(({ g }) => groveCard(g)).join('') || '<div class="empty">おすすめの竹林はまだありません。</div>'}</div>
    </section>
    ${untried.length ? `<section class="box sun">
      <h3>次はこの活動にも挑戦してみませんか？</h3>
      <p class="hint">まだ経験していない活動です。初めての活動は <b>+20pt</b> の初挑戦ボーナスがつきます。</p>
      <div class="chips">${untried.map(c => `<button class="chip" data-act="trycat" data-c="${c}">${CAT_ICON[c](15)}${CATS[c].label}</button>`).join('')}</div>
    </section>` : ''}`;
  },

  /* ---------- さがす（参加者） ---------- */
  search() {
    const f = state.f, u = state.user;
    if (!f.purposes) f.purposes = new Set(u.purposes || []);
    const list = filteredGroves();
    return `
    <section class="panel">
      <h3>やりたい目的でさがす</h3>
      <div class="chips">${PURPOSES.map(p => `<button class="chip purpose" data-act="fpurpose" data-p="${p.id}" aria-pressed="${f.purposes.has(p.id)}">${p.short}</button>`).join('')}</div>
      <details class="more" id="moreFilters" ${f.cats.size || f.burden || f.reward || f.when || f.dist ? 'open' : ''}>
        <summary>${I.filter}作業内容・負担度・報酬・日時・場所でしぼる</summary>
        <div class="chips" style="margin-bottom:10px">${Object.entries(CATS).map(([k, c]) => `<button class="chip" data-act="fcat" data-c="${k}" aria-pressed="${f.cats.has(k)}">${CAT_ICON[k](14)}${c.label}</button>`).join('')}</div>
        <div class="filters">
          <label>負担度<select class="sel" id="f-burden"><option value="0">こだわらない</option><option value="1" ${f.burden == 1 ? 'selected' : ''}>軽めだけ</option><option value="2" ${f.burden == 2 ? 'selected' : ''}>ふつうまで</option></select></label>
          <label>報酬<select class="sel" id="f-reward"><option value="">こだわらない</option>${Object.entries(REWARD_TYPES).map(([k, v]) => `<option value="${k}" ${f.reward === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
          <label>日時<select class="sel" id="f-when"><option value="">いつでも</option><option value="month" ${f.when === 'month' ? 'selected' : ''}>今月</option><option value="next" ${f.when === 'next' ? 'selected' : ''}>来月</option><option value="weekend" ${f.when === 'weekend' ? 'selected' : ''}>土日だけ</option></select></label>
          <label>場所<select class="sel" id="f-dist"><option value="0">どこでも</option><option value="5" ${f.dist == 5 ? 'selected' : ''}>5km以内</option><option value="10" ${f.dist == 10 ? 'selected' : ''}>10km以内</option></select></label>

    </div>
    <div class="toolbar">
      <span class="count">${list.length}件の竹林</span>
      <select class="sel" id="f-sort" style="width:auto" aria-label="並び替え">

        <option value="near" ${f.sort === 'near' ? 'selected' : ''}>近い順</option>

      </select>
    </div>
    <div class="cards">${list.map(g => groveCard(g, true)).join('') || '<div class="empty">条件に合う竹林がありません。条件を少しゆるめてみてください。</div>'}</div>`;
  },

  /* ---------- 竹林の詳細 ---------- */
  detail() {

    return `
    <div class="banner">${groveImg(g)}</div>

      ${m.hits.length ? `<ul class="reward-list">${m.hits.map(p => `<li>${I.check.replace('width="44" height="44"', 'width="16" height="16"')}<span><b>${PURPOSE[p].short}</b>：${PURPOSE[p].why}</span></li>`).join('')}</ul>` : '<p class="hint">あなたの目的と直接は合いませんが、新しい経験になるかもしれません。</p>'}

      <h3 style="margin-top:4px">参加するメリット</h3>

    <section>

      <div class="task-list">${g.cats.map(c => `<div class="task-row"><span class="ic">${CAT_ICON[c](22)}</span><div><b>${CATS[c].label}</b><span>${CATS[c].sub}・${CATS[c].base}pt〜</span></div></div>`).join('')}</div>

      ${g.useTerms ? `<p>${esc(g.useTerms)}</p>` : ''}
    </section>
    <section>
      <div class="section-title">竹林の場所</div>
      <div class="lmap" id="detailMap"></div>
    </section>
    ${g.note ? `<section class="box"><div class="who"><span class="avatar">${esc(o.name.slice(0, 1))}</span>${esc(o.name)}さんより</div><p>${esc(g.note)}</p></section>` : ''}`;

          <button type="button" class="btn ghost small" style="align-self:flex-start" data-act="addreward">＋ 報酬を追加</button>

        <div class="field"><span class="lbl">参加するメリット</span>
          <div class="checks">${MERITS.map(x => `<label class="check"><input type="checkbox" name="merits" value="${x}"><span>${x}</span></label>`).join('')}</div>
          <input type="text" id="r-merit2" placeholder="そのほかのメリット（任意）"></div>
      </fieldset>

      <fieldset class="fs"><legend>5. 竹の活用方法・利用条件</legend>
        <div class="field"><span class="lbl">切った竹の使いみち</span>
          <div class="checks three">${USES.map(x => `<label class="check"><input type="checkbox" name="uses" value="${x}"><span>${x}</span></label>`).join('')}</div></div>
        <div class="field"><label for="r-useterms">竹の利用条件</label><input type="text" id="r-useterms" placeholder="例：持ち帰り自由・商用利用もOK"></div>
        <div class="field"><label for="r-note">参加者へのひとこと</label><textarea id="r-note" placeholder="例：祖父から受け継いだ竹林です。"></textarea></div>
      </fieldset>
      <div class="err" id="regErr" hidden></div>
    </form>`;
  },

  registered() {
    const g = grove(state.params.id);
    return `<div class="done">
      <div class="badge">${I.check}</div>
      <h2>竹林を登録しました</h2>
      <p>「${esc(g.name)}」が参加者の検索結果に表示されます。目的の合う参加者には「おすすめ」として表示されます。</p>
      <div class="stack">
        <button class="btn" data-act="detail" data-id="${g.id}">掲載内容を確認する</button>
        <button class="btn ghost" data-act="tab" data-to="home">ホームにもどる</button>
      </div></div>`;
  },

  /* ---------- やりとり（チャット一覧） ---------- */
  chats() {
    const ts = myThreads();
    const u = state.user;
    return `
    <p class="hint">マッチングが成立した相手と、日時・集合場所・作業内容・持ち物・注意事項を相談できます。</p>
    <div class="list">${ts.length ? ts.map(a => {
      const g = grove(a.groveId), other = acc(u.role === 'owner' ? a.workerId : g.ownerId);
      const ms = db.msgs.filter(m => m.appId === a.id), last = ms[ms.length - 1];
      return `<button class="thread" data-act="chat" data-id="${a.id}"><span class="avatar">${esc(other.name.slice(0, 1))}</span>
        <span class="t"><b>${esc(other.name)}さん</b><small>${esc(g.name)}</small><small>${last ? esc(last.text) : ''}</small></span>
        <span class="status ${a.status === 'done' ? 'st-done' : 'st-matched'}">${a.status === 'done' ? '活動済み' : '調整中'}</span></button>`;
    }).join('') : `<div class="empty">${isOwner() ? '応募を承認すると、ここで参加者とやりとりできます。' : '応募が承認されると、ここで所有者とやりとりできます。'}</div>`}</div>`;
  },

  chat() {
    const a = app(state.params.id), g = grove(a.groveId), u = state.user;
    const other = acc(u.role === 'owner' ? a.workerId : g.ownerId);
    const ms = db.msgs.filter(m => m.appId === a.id);
    const act = db.acts.find(x => x.appId === a.id);
    return `
    <div class="chat-head"><span class="avatar">${esc(other.name.slice(0, 1))}</span>
      <span class="t"><b>${esc(other.name)}さん</b><small>${esc(g.name)}・${fmtDate(g.date, g.time)}</small></span>
      <button class="btn ghost small" data-act="detail" data-id="${g.id}">竹林</button></div>
    ${isOwner() && a.status === 'matched' ? `<button class="btn sun" data-act="complete" data-id="${a.id}">活動が終わったら：活動実績を記録する</button>` : ''}
    ${act ? `<div class="box sun"><b>活動実績 +${act.pt}pt</b><span class="hint">${act.cats.map(c => CATS[c].label).join('・')}（${shortDate(act.date)}）</span></div>` : ''}
    <div class="msgs" id="msgs">${ms.map(m => {
      if (m.from === 'sys') return `<div class="msg sys"><span class="bub">${esc(m.text)}</span></div>`;
      const me = m.from === u.id;
      return `<div class="msg ${me ? 'me' : 'them'}">${me ? '' : `<span class="from">${esc(acc(m.from).name)}</span>`}<span class="bub">${esc(m.text)}</span><time>${m.ts.slice(5).replace('-', '/')}</time></div>`;
    }).join('')}</div>`;
  },

  /* ---------- 竹の活用 ---------- */
  bamboo() {
    const lots = [...db.lots].sort((a, b) => b.date.localeCompare(a.date));
    const myLots = isOwner() ? lots.filter(l => grove(l.groveId).ownerId === state.user.id) : [];
    const others = isOwner() ? lots.filter(l => grove(l.groveId).ownerId !== state.user.id) : lots;
    return `
    <section class="box">
      <h3>整備した竹を、必要な人・事業者へ</h3>
      <p class="hint">竹の状態や特徴を記録すると、合った活用先を提案します。竹を必要としている事業者ともつながれます。</p>
      <div class="flow"><span>竹林整備</span>→<span>竹を記録</span>→<span>活用先を提案</span>→<span>事業者につなぐ</span></div>
    </section>
    <button class="big-choice primary" data-act="go" data-to="record"><span class="ic">${CAT_ICON.chosa(26)}</span><span><b>竹を記録する</b><small>本数・年数・太さ・状態など</small></span><span class="arr">${I.arrow}</span></button>
    ${isOwner() ? `<section><div class="section-title">あなたの竹林の竹</div><div class="list">${myLots.map(lotItem).join('') || '<div class="empty">まだ記録した竹はありません。</div>'}</div></section>` : ''}
    <section><div class="section-title">${isOwner() ? 'ほかの竹林の竹' : '活用を待っている竹'}</div><div class="list">${others.map(lotItem).join('') || '<div class="empty">まだ記録された竹はありません。</div>'}</div></section>
    <section>
      <div class="section-title">竹を必要としている事業者（例）</div>
      <div class="list">${db.demands.map(d => `<div class="demand"><span class="avatar">${esc(d.use.slice(0, 1))}</span><span class="t"><b>${esc(d.name)}</b><small>${esc(d.use)}：${esc(d.want)}・${esc(d.area)}</small></span></div>`).join('')}</div>
    </section>`;
  },

  lot() {
    const l = lot(state.params.id), g = grove(l.groveId), sug = suggestUses(l);
    const useSet = new Set(sug.map(s => s.use));
    const ds = db.demands.filter(d => useSet.has(d.use));
    const linked = db.links.filter(k => k.lotId === l.id);
    const canConnect = isOwner() && g.ownerId === state.user.id;
    return `
    <section class="box">
      <div class="item-top"><h3>${esc(g.name)}の竹</h3><span class="tag line">${shortDate(l.date)} 記録</span></div>
      ${lotSpecs(l)}
      ${l.note ? `<p class="hint">${esc(l.note)}</p>` : ''}
    </section>
    <section>
      <div class="section-title">おすすめの活用先</div>
      <div class="suggest">${sug.map(s => `<div class="suggest-row"><span class="ic">${s.use.slice(0, 1)}</span><div><b>${s.use}<span class="hint">（${USE_NOTE[s.use]}）</span></b><span>${s.why}</span></div></div>`).join('')}</div>
    </section>
    <section>
      <div class="section-title">この竹を必要としている事業者</div>
      <div class="list">${ds.map(d => {
        const done = linked.find(k => k.demandId === d.id);
        return `<div class="demand"><span class="avatar">${esc(d.use.slice(0, 1))}</span><span class="t"><b>${esc(d.name)}</b><small>${esc(d.use)}：${esc(d.want)}</small></span>
          ${done ? '<span class="status st-matched">つないだ（相談中）</span>' : canConnect ? `<button class="btn small" data-act="link" data-lot="${l.id}" data-d="${d.id}">つなぐ</button>` : ''}</div>`;

    </section>
    ${!isOwner() ? `<section class="box sun"><h3>この竹を使いたい</h3><p class="hint">竹を自分の活動やビジネスに使いたい場合は、所有者に希望を伝えられます。</p>
      ${linked.some(k => k.userId === state.user.id) ? '<span class="status st-matched" style="align-self:flex-start">希望を伝えました</span>' : `<button class="btn" data-act="wantlot" data-id="${l.id}">この竹を使いたいと伝える</button>`}</section>` : ''}
    <p class="note">提案は竹の年数・太さ・状態をもとにした目安です。データが増えると、より正確な提案ができるようになります。</p>`;
  },

  record() {
    const gs = isOwner() ? db.groves.filter(isMine) : db.groves.filter(g => actsOf(state.user.id).some(a => a.groveId === g.id) || db.apps.some(a => a.groveId === g.id && a.workerId === state.user.id));

    return `
    <form id="lotForm" novalidate>
      <div class="field"><label for="k-grove">どの竹林の竹ですか？</label>
        ${gs.length ? `<select class="input" id="k-grove">${gs.map(g => `<option value="${g.id}" ${g.id === pre ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>` : '<div class="empty">記録できる竹林がありません。竹林を登録するか、活動に参加すると記録できます。</div>'}</div>
      <div class="field"><label for="k-count">本数（だいたい）</label><input type="number" id="k-count" value="50" min="1" inputmode="numeric"></div>
      <div class="pair">
        <div class="field"><label for="k-age">竹の年数</label>${sel('k-age', LOT.age, 'mature')}</div>
        <div class="field"><label for="k-diam">太さ（直径）</label>${sel('k-diam', LOT.diam, 'mid')}</div>
      </div>
      <div class="pair">
        <div class="field"><label for="k-cond">状態</label>${sel('k-cond', LOT.cond, 'green')}</div>
        <div class="field"><label for="k-shape">形</label>${sel('k-shape', LOT.shape, 'straight')}</div>
      </div>
      <div class="field"><label for="k-note">メモ</label><input type="text" id="k-note" placeholder="例：長さ3mにそろえて保管中"></div>
      <div class="preview" id="lotPreview"></div>
    </form>`;
  },

  /* ---------- マイページ ---------- */
  mypage() {
    const u = state.user;
    const profile = `<div class="profile"><span class="avatar">${esc(u.name.slice(0, 1))}</span><div><b>${esc(u.name)}さん</b>
      <span>${isOwner() ? '竹林所有者・農家' : '参加者'}${u.area ? '・' + esc(u.area) : ''}${u.org ? '・' + esc(u.org) : ''}</span></div></div>`;
    const tail = `<div class="row"><button class="btn ghost" data-act="logout">ログアウト</button></div>`;

    if (isOwner()) {
      const mine = db.groves.filter(isMine);
      return `${profile}
      <div class="stats">
        <div class="stat"><b>${mine.length}</b><span>登録した竹林</span></div>
        <div class="stat"><b>${db.apps.filter(a => mine.some(g => g.id === a.groveId)).length}</b><span>届いた応募</span></div>
        <div class="stat"><b>${db.acts.filter(a => mine.some(g => g.id === a.groveId)).length}</b><span>行われた活動</span></div>
      </div>
      <section><div class="section-title">登録した竹林と応募者</div>
      <div class="list">${mine.map(g => {
        const as = db.apps.filter(a => a.groveId === g.id);
        return `<div class="item">
          <div class="item-top"><h3>${esc(g.name)}</h3><span class="status ${isFull(g) ? 'st-matched' : 'st-pending'}">${isFull(g) ? '人数がそろいました' : '募集中'}</span></div>
          <div class="meta"><span>${fmtDate(g.date, g.time)}</span><span>参加 ${joined(g)}/${g.people}名</span></div>
          ${as.length ? as.map(a => applicantRow(a)).join('') : '<p class="hint">まだ応募はありません。</p>'}
          <button class="btn ghost small" data-act="detail" data-id="${g.id}">掲載内容を見る</button></div>`;
      }).join('') || `<div class="empty">まだ登録した竹林はありません。</div>`}</div></section>${tail}`;
    }

    const pt = pointsOf(u.id), rk = rankOf(pt), cp = catPoints(u.id), maxc = Math.max(40, ...Object.values(cp));
    const acts = actsOf(u.id), apps = db.apps.filter(a => a.workerId === u.id);
    const tabNow = state.myTab || 'record';
    const st = { pending: ['承認待ち', 'st-pending'], matched: ['マッチング成立', 'st-matched'], done: ['活動済み', 'st-done'], declined: ['今回は見送り', 'st-declined'] };
    return `${profile}
    <section class="rank-card">
      <svg class="deco" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2"><path d="M11 3v26M21 3v26M8 10h6M8 19h6M18 7h6M18 16h6M18 25h6"/></svg>
      <span class="lab">竹林活動実績</span>
      <span class="val">${num(pt)}<small>pt</small></span>
      <span class="rank">ランク：${rk.cur.name}</span>
      ${rk.next ? `<span class="bar"><i style="width:${((pt - rk.cur.min) / (rk.next.min - rk.cur.min) * 100).toFixed(0)}%"></i></span><span class="next">あと<b>${rk.next.min - pt}pt</b>で次のランク「${rk.next.name}」</span>` : '<span class="next">最高ランクです！</span>'}
    </section>
    <div class="stats">
      <div class="stat"><b>${monthCount(u.id)}</b><span>今月の活動</span></div>
      <div class="stat"><b>${acts.length}</b><span>これまでの活動</span></div>
      <div class="stat"><b>${Object.values(cp).filter(v => v > 0).length}/5</b><span>経験した活動の種類</span></div>
    </div>
    <section class="box">
      <h3>活動の種類ごとの実績</h3>
      <p class="hint">竹を切るだけでなく、運搬・調査・広報・加工もすべて実績になります。</p>
      <div class="catbars">${Object.entries(CATS).map(([k, c]) => `<div class="catbar ${cp[k] ? '' : 'zero'}"><span>${c.label}</span><span class="bar sun"><i style="width:${(cp[k] / maxc * 100).toFixed(0)}%"></i></span><span>${Math.round(cp[k])}pt</span></div>`).join('')}</div>
    </section>
    <section class="box">
      <div class="item-top"><h3>やりたい目的</h3><button class="link" data-act="editprof">変更する</button></div>
      <div class="tags">${(u.purposes || []).map(p => `<span class="tag sun">${PURPOSE[p].label}</span>`).join('') || '<span class="hint">未設定</span>'}</div>
      <div class="tags">${(u.cats || []).map(c => `<span class="tag">${CATS[c].label}</span>`).join('')}</div>
    </section>
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="${tabNow === 'record'}" data-act="mytab" data-t="record">活動履歴</button>
      <button role="tab" aria-selected="${tabNow === 'apps'}" data-act="mytab" data-t="apps">応募した竹林</button>
    </div>
    ${tabNow === 'record'
      ? (acts.length ? `<ul class="timeline">${acts.map(a => `<li><time>${shortDate(a.date)}</time><span>${esc(a.title)}<br><span class="hint">${a.cats.map(c => CATS[c].label).join('・')}</span></span><span class="plus">+${a.pt}pt</span></li>`).join('')}</ul>` : '<div class="empty">まだ活動の記録はありません。</div>')
      : `<div class="list">${apps.map(a => { const g = grove(a.groveId); return `<div class="item">
          <div class="item-top"><h3>${esc(g.name)}</h3><span class="status ${st[a.status][1]}">${st[a.status][0]}</span></div>
          <div class="meta"><span>${fmtDate(g.date, g.time)}</span><span>${g.cats.map(c => CATS[c].label).join('・')}</span></div>
          ${a.status === 'matched' || a.status === 'done' ? `<button class="btn small" data-act="chat" data-id="${a.id}">${I.chat(16)}チャットを開く</button>` : a.status === 'pending' ? '<span class="hint">所有者が応募を確認しています。</span>' : ''}</div>`; }).join('') || '<div class="empty">まだ応募した竹林はありません。</div>'}</div>`}
    ${tail}`;
  },
};

/* ---------- 部品 ---------- */
function groveCard(g, withId) {
  const m = matchInfo(g), own = isOwner();
  return `<button class="card ${withId && state.selected === g.id ? 'sel' : ''}" data-act="detail" data-id="${g.id}" ${withId ? `id="card-${g.id}"` : ''}>
    <span class="card-top"><span class="thumb">${groveImg(g)}</span>
    <span class="body"><h3>${esc(g.name)}</h3>
      <span class="meta"><span>${fmtDate(g.date)}</span><span>${distLabel(g)}</span><span>約${g.hours}時間</span></span>
      <span class="tags">${catTags(g.cats)}</span>
      <span class="meta">${burdenHTML(g.burden)}<span>${isFull(g) ? '<b>定員に達しました</b>' : `あと${g.people - joined(g)}名`}</span></span>
    </span></span>
    <span class="rewards">${g.rewards.map(r => `<span class="tag sun">${esc(r.text)}</span>`).join('')}</span>
    ${!own ? `<span class="match"><b>${m.score}%</b><span>${m.hits.length ? 'あなたの目的に合う：' + m.hits.map(p => PURPOSE[p].short).join('・') : '新しい経験になるかも'}</span></span>` : ''}
  </button>`;
}
function applicantRow(a, withGrove) {
  const w = acc(a.workerId), g = grove(a.groveId), pt = pointsOf(w.id), rk = rankOf(pt);
  const st = { pending: '', matched: '<span class="status st-matched">成立</span>', done: '<span class="status st-done">活動済み</span>', declined: '<span class="status st-declined">見送り</span>' };
  return `<div class="applicant"><span class="avatar">${esc(w.name.slice(0, 1))}</span>
    <button class="nm" data-act="profile" data-id="${w.id}"><b>${esc(w.name)}さん${w.org ? `（${esc(w.org)}）` : ''}</b>
      <small>${withGrove ? esc(g.name) + '・' : ''}${rk.cur.name} ${pt}pt・目的：${(w.purposes || []).map(p => PURPOSE[p].short).join('・') || '—'}</small></button>
    <span class="acts">${a.status === 'pending'
      ? `<button class="btn quiet small" data-act="decline" data-id="${a.id}">見送る</button><button class="btn small" data-act="approve" data-id="${a.id}">承認</button>`
      : (a.status === 'matched' || a.status === 'done') ? `${st[a.status]}<button class="btn ghost small" data-act="chat" data-id="${a.id}">${I.chat(15)}</button>` : st[a.status]}</span></div>`;
}
const rewardRow = (type, text) => `<div class="reward-row"><select class="input" name="rtype" aria-label="報酬の種類">${Object.entries(REWARD_TYPES).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v}</option>`).join('')}</select>
  <input type="text" name="rtext" value="${esc(text)}" placeholder="例：整備してくれたら3,000円" aria-label="報酬の内容"><button type="button" data-act="delreward" aria-label="この報酬を消す">×</button></div>`;
const lotSpecs = l => `<div class="lot-specs"><div><small>本数</small>${num(l.count)}本</div><div><small>年数</small>${LOT.age[l.age].replace('（幼竹）', '')}</div><div><small>太さ</small>${LOT.diam[l.diam]}</div><div><small>状態</small>${LOT.cond[l.cond]}</div></div>`;
function lotItem(l) {
  const g = grove(l.groveId), sug = suggestUses(l), links = db.links.filter(k => k.lotId === l.id);
  return `<button class="item" data-act="lot" data-id="${l.id}">
    <span class="item-top"><h3>${esc(g.name)}の竹</h3><span class="tag line">${shortDate(l.date)}</span></span>
    ${lotSpecs(l)}
    <span class="tags"><span class="hint">おすすめ：</span>${sug.map(s => `<span class="tag sky">${s.use}</span>`).join('')}</span>
    ${links.length ? `<span class="hint">${links.map(k => k.demandId ? db.demands.find(d => d.id === k.demandId).name : acc(k.userId).name + 'さん').join('・')} と相談中</span>` : ''}
  </button>`;
}
function filteredGroves() {
  const f = state.f;
  const y = Number(TODAY.slice(0, 4)), mo = Number(TODAY.slice(5, 7));
  const nextYM = mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`;
  let list = db.groves.filter(g => g.date >= TODAY && !isMine(g));
  if (f.purposes.size) list = list.filter(g => [...f.purposes].some(p => PURPOSE[p].test(g)));
  if (f.cats.size) list = list.filter(g => g.cats.some(c => f.cats.has(c)));
  if (f.burden) list = list.filter(g => g.burden <= f.burden);
  if (f.reward) list = list.filter(g => g.rewards.some(r => r.type === f.reward));
  if (f.when === 'month') list = list.filter(g => g.date.slice(0, 7) === TODAY.slice(0, 7));
  if (f.when === 'next') list = list.filter(g => g.date.slice(0, 7) === nextYM);
  if (f.when === 'weekend') list = list.filter(g => { const [a, b, c] = g.date.split('-').map(Number); const d = new Date(a, b - 1, c).getDay(); return d === 0 || d === 6; });
  if (f.dist) list = list.filter(g => km(state.here, g) <= f.dist);
  const sorters = { match: (a, b) => matchInfo(b).score - matchInfo(a).score, near: (a, b) => km(state.here, a) - km(state.here, b), date: (a, b) => a.date.localeCompare(b.date) };
  return list.sort(sorters[f.sort]);
}

/* ---------- チャット ---------- */
function sendMsg(appId, from, text) {
  db.msgs.push({ id: nextId(), appId, from, text, ts: nowTs() }); commit();
  if (state.screen === 'chat' && state.params.id === appId) { render(false); window.scrollTo(0, document.body.scrollHeight); }
  // 相手がデモ用のサンプルアカウントなら自動で返信（発表用）
  const a = app(appId), g = grove(a.groveId);
  const otherId = from === g.ownerId ? a.workerId : g.ownerId;
  const other = acc(otherId);
  if (from === state.user.id && !other.demo && !other.id.startsWith('u')) {
    const reply = /日|時/.test(text) ? `はい、${fmtDate(g.date, g.time)}でお願いします！` : /集合|場所/.test(text) ? `${g.addr}の竹林の入口に集合でお願いします。` : /持ち物|何が/.test(text) ? '軍手・長袖・長ぐつ・飲み物をお願いします。' : /安全|注意/.test(text) ? (g.safety || '作業前に安全説明をします。') : 'ありがとうございます。当日よろしくお願いします！';
    setTimeout(() => sendMsg(appId, otherId, reply), 1300);
  }
}

/* ---------- 操作 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'closesheet' && t.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  const id = Number(t.dataset.id);
  const A = t.dataset.act;
  switch (A) {
    case 'back': back(); break;
    case 'tab': if (t.dataset.tab) state.myTab = t.dataset.tab; tab(t.dataset.to); break;
    case 'go': go(t.dataset.to); break;
    case 'detail': go('detail', { id }); break;
    case 'chat': go('chat', { id }); break;
    case 'lot': go('lot', { id }); break;
    case 'authtab': state.authTab = t.dataset.t; render(false); break;
    case 'demologin': login(acc(t.dataset.id)); break;
    case 'logout': state.user = null; state.authTab = 'login'; try { localStorage.removeItem(USER_KEY); } catch (x) {} render(true); toast('ログアウトしました'); break;
    case 'reset': state.sheet = { type: 'reset' }; renderSheet(); break;
    case 'confirmreset': db = seedDB(); commit(); state.sheet = null; state.user = null; try { localStorage.removeItem(USER_KEY); } catch (x) {} render(true); toast('デモデータを最初の状態に戻しました'); break;
    case 'closesheet': state.sheet = null; renderSheet(); break;
    case 'fpurpose': { const s = state.f.purposes, p = t.dataset.p; s.has(p) ? s.delete(p) : s.add(p); render(false); break; }
    case 'fcat': { const s = state.f.cats, c = t.dataset.c; s.has(c) ? s.delete(c) : s.add(c); render(false); break; }
    case 'trycat': state.f.cats = new Set([t.dataset.c]); state.f.purposes = new Set(); tab('search'); break;
    case 'gps': case 'reggps': {
      if (!navigator.geolocation) { toast('この端末では現在地を取得できません'); break; }
      toast('現在地を取得しています…');
      navigator.geolocation.getCurrentPosition(p => {
        const ll = { lat: p.coords.latitude, lng: p.coords.longitude };
        if (A === 'gps') { state.here = { ...ll, label: '現在地' }; state.mapView = null; render(false); toast('現在地を使って距離を計算しました'); }
        else { AFTER._place && AFTER._place(ll); toast('現在地にピンを立てました'); }
      }, () => toast('現在地を取得できませんでした。位置情報の許可を確認してください。'), { timeout: 8000 });
      break;
    }
    case 'apply': state.sheet = { type: 'apply', id }; renderSheet(); break;
    case 'confirmapply': {
      const msg = $('#ap-msg')?.value.trim() || '';
      const a = { id: nextId(), groveId: id, workerId: state.user.id, status: 'pending', msg, date: TODAY };
      db.apps.push(a);
      const g = grove(id), owner = acc(g.ownerId);
      // サンプルの所有者は自動で承認（発表用）。デモ所有者アカウントの竹林は所有者が承認する
      if (!owner.demo && !owner.id.startsWith('u')) setTimeout(() => { approveApp(a, true); toast(`${owner.name}さんが応募を承認しました。マッチング成立です！`); if (state.user) render(false); }, 2500);
      commit();
      state.stack = [{ screen: 'search', params: {} }]; state.screen = 'applied'; state.params = { id }; state.sheet = null; render(true);
      break;
    }
    case 'approve': approveApp(app(id)); toast('承認しました。マッチング成立です。チャットで日程を相談しましょう'); render(false); break;
    case 'decline': app(id).status = 'declined'; commit(); toast('今回は見送りにしました'); render(false); break;
    case 'profile': state.sheet = { type: 'profile', id: t.dataset.id }; renderSheet(); break;
    case 'complete': state.sheet = { type: 'complete', id }; renderSheet(); break;
    case 'confirmcomplete': {
      const a = app(id), g = grove(a.groveId);
      const cats = [...document.querySelectorAll('#cmpCats input:checked')].map(x => x.value);
      if (!cats.length) { toast('活動を1つ以上えらんでください'); break; }
      const hours = Number($('#cmpHours').value), r = calcPoints(cats, hours, a.workerId);
      db.acts.push({ id: nextId(), workerId: a.workerId, groveId: g.id, appId: a.id, date: TODAY, cats, hours, pt: r.total, title: g.name });
      a.status = 'done';
      db.msgs.push({ id: nextId(), appId: a.id, from: 'sys', text: `活動が記録されました（${cats.map(c => CATS[c].label).join('・')}）。竹林活動実績 +${r.total}pt`, ts: nowTs() });
      commit(); state.sheet = null; render(false);
      toast(`活動を記録しました。${acc(a.workerId).name}さんに +${r.total}pt`);
      break;
    }
    case 'tpl': { const inp = $('#chatInput'); inp.value = chatTemplates[t.dataset.k] || ''; inp.focus(); break; }
    case 'addreward': $('#rewardRows').insertAdjacentHTML('beforeend', rewardRow('shoot', '')); break;
    case 'delreward': { const rows = document.querySelectorAll('#rewardRows .reward-row'); if (rows.length > 1) t.closest('.reward-row').remove(); else t.closest('.reward-row').querySelector('input').value = ''; break; }
    case 'step': { const inp = $('#r-people'); inp.value = Math.min(50, Math.max(1, (Number(inp.value) || 1) + Number(t.dataset.d))); break; }
    case 'filldemo': fillDemo(); break;
    case 'mytab': state.myTab = t.dataset.t; render(false); break;
    case 'editprof': state.sheet = { type: 'editprof' }; renderSheet(); break;
    case 'saveprof': {
      const u = state.user;
      u.purposes = [...document.querySelectorAll('#epP input:checked')].map(x => x.value);
      u.cats = [...document.querySelectorAll('#epC input:checked')].map(x => x.value);
      state.f.purposes = null; commit(); state.sheet = null; render(false); toast('やりたい目的を保存しました'); break;
    }
    case 'link': {
      db.links.push({ id: nextId(), lotId: Number(t.dataset.lot), demandId: Number(t.dataset.d), by: state.user.id, date: TODAY }); commit();
      render(false); toast('事業者に竹の情報を送りました（デモ）。相談中として表示されます'); break;
    }
    case 'wantlot': {
      db.links.push({ id: nextId(), lotId: id, demandId: null, userId: state.user.id, date: TODAY }); commit();
      render(false); toast('所有者に「この竹を使いたい」と伝えました（デモ）'); break;
    }
  }
});
function approveApp(a, auto) {
  if (!a || a.status !== 'pending') return;
  a.status = 'matched';
  db.msgs.push({ id: nextId(), appId: a.id, from: 'sys', text: 'マッチングが成立しました。日時・集合場所・作業内容・持ち物・注意事項を相談しましょう。', ts: nowTs() });
  const g = grove(a.groveId);
  if (auto) db.msgs.push({ id: nextId(), appId: a.id, from: g.ownerId, text: `ご応募ありがとうございます！${fmtDate(g.date, g.time)}、よろしくお願いします。わからないことは何でも聞いてください。`, ts: nowTs() });
  commit();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderSheet(); } });

render(true);
</script>
</body>
</html>
